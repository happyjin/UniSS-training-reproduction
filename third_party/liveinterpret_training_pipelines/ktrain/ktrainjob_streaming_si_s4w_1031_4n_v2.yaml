    SI_P2_WAV_DIRS: >-
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/en2zh/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/zh2en/p2_source_wav/
