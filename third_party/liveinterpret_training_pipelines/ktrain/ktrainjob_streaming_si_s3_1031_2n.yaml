# =============================================================================
# S3 正式：训整个 talker（467M）。MODEL_PATH = S3-w_1031 final（gate PASS）
# 2 节点 16 卡（09a68c+0a3ebd；08e3257c/03e7d1f6 修复中）
# ============================================================================
apiVersion: ktrain.oit-svc.com/v1alpha2
kind: KtrainJob
metadata:
  name: __JOB_NAME__
  namespace: speech-h200
  annotations:
    ktrain.oit-svc.com/owner: stevehguo
    ktrain.oit-svc.com/render-extra: >-
      {"hyperpod": true, "no_metrics_sidecar": true,
       "efa_devices_per_worker": 32,
       "tolerations": [{"key": "node-type", "operator": "Equal", "value": "gpu", "effect": "NoSchedule"}],
       "node_selector": {"node.kubernetes.io/instance-type": "ml.p5e.48xlarge"},
       "affinity": {
         "nodeAffinity": {
           "requiredDuringSchedulingIgnoredDuringExecution": {
             "nodeSelectorTerms": [{"matchExpressions": [
               {"key": "kubernetes.io/hostname", "operator": "In",
                "values": ["hyperpod-i-09a68c454800140d6", "hyperpod-i-0a3ebd369de798192"]}
             ]}]
           }
         }
       },
       "extra_volumes": [
         {"name": "s3all", "persistentVolumeClaim": {"claimName": "speech-h200-s3-pvc", "readOnly": true}},
         {"name": "nvme", "hostPath": {"path": "/opt/dlami/nvme", "type": "Directory"}}
       ],
       "extra_volume_mounts": [
         {"name": "s3all", "mountPath": "/s3all", "readOnly": true},
         {"name": "nvme", "mountPath": "/nvme"}
       ],
       "shm_size": "64Gi"
      }
spec:
  framework: pytorch
  image: 124355679795.dkr.ecr.ap-southeast-3.amazonaws.com/ktrain/speech-language-model:p5-cuda12.8-torch2.8-te-v9-streaming-si-v1
  command: ["bash", "-c", "/opt/launcher/launch_train.sh"]
  numNodes: 2
  resources:
    cpu: "90"
    memory: 900Gi
    gpu: 8
  env:
    TRAIN_SCRIPT: "pipelines/streaming_si/ktrain_entry.sh"
    CODE_PREFIX: "__OWNER__/liveinterpret_training_pipelines"
    NVME_MOUNT: "/nvme"

    SI_STAGE: "s3"
    MODEL_PATH: "s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/model_checkpoint/streaming_si_swift/trained_streaming_si_4b/S3-w_1031_ckpt2500/"
    SI_S1_DATA: "s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/open_data_0803_fortrain/TTS/emilia_fsq_v3/s1_emilia_fsq_v3/"

    OUTPUT_ROOT: "/nvme/output/__OWNER__/streaming_si"

    # S3：训整个 talker（467M），lr 1e-4，1 epoch（38.1M 行 / 全局 batch 1024 ≈ 37200 步）
    PER_DEVICE_TRAIN_BATCH_SIZE: "64"
    LEARNING_RATE: "1e-4"
    WARMUP_RATIO: "0.03"
    NUM_TRAIN_EPOCHS: "1"
    GROUP_BY_LENGTH: "true"
    DATASET_NUM_PROC: "16"

    NCCL_IB_DISABLE: "0"
    NCCL_SOCKET_IFNAME: "^lo,docker0"
    FI_PROVIDER: "efa"
    NCCL_DEBUG: "INFO"
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "300"
    FI_EFA_FORK_SAFE: "1"
    FI_EFA_USE_DEVICE_RDMA: "1"
    NCCL_DEBUG_SUBSYS: "INIT,NET,ENV"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
