# =============================================================================
# KtrainJob (ktrain.oit-svc.com/v1alpha2) — 经 ktrain CLI 提交，H200 集群。
#
# streaming_si S4-w / S4（离线 S2ST：源音频 -> 译文 + 目标 FSQ）· torchrun + DeepSpeed ZeRO-2 ·
# 3 台机器的 UniST P2 数据从 S3 同步到各节点 NVMe。节点数由白名单与 numNodes 决定（两者须一致）。
# （2026-10 改名前：本文件由 ktrainjob_streaming_si_s3_2node.yaml / _s3_3node.yaml / _s3_joint_2node.yaml
#   合并而来，S4-w / S4 即源项目的 S3-w / S3。）
#
# 两个阶段共用本 yaml（见 pipelines/streaming_si/train_s2st.sh 头注释）：
#   s4-w  跨池桥接预热：只训 talker.thinker_proj + talker.fusion（10.5M），只算语音 loss，
#         lr 3e-4、2500 步（约 64 万样本，与源 S3-w 相当）；MODEL_PATH = S3 的最终 checkpoint
#   s4    正式 joint：audio_proj + thinker + talker，lr 5e-5、1 epoch；MODEL_PATH = s4-w 的最终 checkpoint
# s4-w 跑完先验收门 A 再进 s4（在任一跑过本任务的节点上，用训练镜像起 1 卡）：
#   python custom/streaming_si/scripts/s4w_bridge_gate.py --model <s4-w ckpt> --baseline <S3 ckpt> \
#       --data '/nvme/_swift_prep/p2_merged_*/p2_fsq_v3/*.parquet' --wav_dir <同目录的 p2_source_wav>
#   要求 eng->cmn、cmn->eng 两个方向 full 的 speech CE 都比 text_only 低 0.005 以上。
# s4 的验收是门 B（生成 / 真实长度比 ≈ 1.0、cap 率 ≈ 0）+ SIM-o + BLEU 不退，不在训练中自动检查。
#
# 【同语言对（2026-10-27）】数据清单与 s2_4n_1031 保持一致（Speech2Speech 10 方向 +
# 噪声 2 + 同语言 4 + machine 3）。同语言对在 s4 joint 教**端到端语音直通**：
# 目标音频=源音频的 FSQ，只有 joint 阶段的 thinker->talker 梯度通路能学会把输入
# 语音的韵律/音色传到输出。s4-w 与 s4 共用本清单：s4-w 只跑 2500 步且同语言对仅占
# ~8%，桥接层风险可控；若门 A 异常优先排查同语言对影响。
#
# 数据变量与 ktrain/ktrainjob_streaming_si_s2.yaml 完全相同：在同一组节点上跑过 S2 后，
# 同步 Job 按大小比对会全部跳过，S4-w / S4 不会重新下载。
# S4-w / S4 额外要求 target_fsq 非空（空的行被丢弃）——S4 例外：train_s2st.sh 设
# SI_KEEP_NOISE_NEG=1，「译文为空的噪声负样本」（negative_noise* 目录）保留，
# 文本 CE 学「噪声+指令 -> 立即 eos」，speech 监督为空（talker 零长度行全 ignore）；
# 译文非空的空 fsq 行仍丢弃。
#
# 【数据（S3 实测 2026-09-29）】s3://stevehguo-ap-southeast-3/.../open_data_0803_fortrain/
#   | 机器          | p2_fsq_v3（parquet） | p2_source_wav（tar） |
#   |---------------|----------------------|----------------------|
#   | machine_0     | 70 个，2.9 GiB       | 70 个，748 GiB       |
#   | machine_1     | 64 个，2.6 GiB       | 64 个，673 GiB       |
#   | machine_2     | 64 个，2.5 GiB       | 206 个，661 GiB      |
#   三台 .cosy_version 均为 v3；parquet 与 tar 跨机器无重名；抽查每台首个 parquet，
#   source_wav 引用的 tar 都在本机器目录。
#   只同步 p2_fsq_v3/ 与 p2_source_wav/（p2_fsq*、p2_target_wav 等其他目录训练不用）。
#   ktrain_entry.sh 在节点上用软链把三台机器合并成一个 parquet 目录 + 一个 tar 目录
#   （数据集要求一个 tar 目录；合并时若 tar 或 parquet 重名直接报错）。
#
# 【磁盘】每个节点约 2.1 TiB（tar）+ 8 GiB（parquet）。
#
# 【链路】submit.sh 同步代码与数据 → launch_train.sh → pipelines/streaming_si/ktrain_entry.sh
#        （转换路径、合并三台机器）→ train_s2st.sh → swift sft（torchrun numNodes×8）
#
# 【提交】
#   bash .codebuddy/training-ops-plugin/skills/ktrain-job-ops/scripts/submit.sh \
#       --yaml ktrain/ktrainjob_streaming_si_s4.yaml \
#       --repo <repo> --launcher ktrain/launch_train.sh \
#       --aws-creds-secret aws-local-creds \
#       --job-name-prefix si-s4 \
#       --task-deadline 'si-p2-wav-dirs=172800'
#   （若这组节点没跑过 S2，2.1 TiB 音频首次同步给 48h 上限；实测约 3 GiB/s，十几分钟。）
#
# 【提交前确认】白名单节点各空闲 8 卡且与 numNodes 一致、SI_STAGE 与 MODEL_PATH 配对（见 env 注释）、
#   学习率 / batch（改节点数时看训练参数注释）；确认 CODE_PREFIX / OUTPUT_ROOT / owner。
# =============================================================================
apiVersion: ktrain.oit-svc.com/v1alpha2
kind: KtrainJob
metadata:
  name: __JOB_NAME__
  namespace: speech-h200
  annotations:
    ktrain.oit-svc.com/owner: stevehguo
    ktrain.oit-svc.com/render-extra: >-
      {"hyperpod": true, "no_metrics_sidecar": true,
       "efa_devices_per_worker": 32,
       "tolerations": [{"key": "node-type", "operator": "Equal", "value": "gpu", "effect": "NoSchedule"}],
       "node_selector": {"node.kubernetes.io/instance-type": "ml.p5e.48xlarge"},
       "affinity": {
         "nodeAffinity": {
           "requiredDuringSchedulingIgnoredDuringExecution": {
             "nodeSelectorTerms": [{"matchExpressions": [
               {"key": "kubernetes.io/hostname", "operator": "In",
                "values": ["hyperpod-i-03e7d1f6d95864e1a", "hyperpod-i-08e3257c716579618", "hyperpod-i-09a68c454800140d6", "hyperpod-i-0a3ebd369de798192"]}
             ]}]
           }
         }
       },
       "extra_volumes": [
         {"name": "s3all", "persistentVolumeClaim": {"claimName": "speech-h200-s3-pvc", "readOnly": true}},
         {"name": "nvme", "hostPath": {"path": "/opt/dlami/nvme", "type": "Directory"}}
       ],
       "extra_volume_mounts": [
         {"name": "s3all", "mountPath": "/s3all", "readOnly": true},
         {"name": "nvme", "mountPath": "/nvme"}
       ],
       "shm_size": "64Gi"
      }
spec:
  framework: pytorch
  # streaming_si 镜像（ktrain/image/Dockerfile.streaming-si）：v9 + fla / causal-conv1d 加速核 + CosyVoice 声码器依赖，
  # 0.6B 与 4B 两个变体通用（4B 的线性注意力走加速核）；torch / TE / EFA 与 v9 相同，训练行为不变。
  image: 124355679795.dkr.ecr.ap-southeast-3.amazonaws.com/ktrain/speech-language-model:p5-cuda12.8-torch2.8-te-v9-streaming-si-v1
  command: ["bash", "-c", "/opt/launcher/launch_train.sh"]
  numNodes: 4                  # = 白名单节点数（derive 要求两者一致；S4-w 也用 4 节点，全局 512 × 2500 步）
  resources:
    cpu: "135"
    memory: 1350Gi
    gpu: 8
  env:
    # 注意：s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/model_checkpoint/streaming_si_swift/ 下的 base_* 是未训练基座，不能作为 S4-w / S4 的起点。
    TRAIN_SCRIPT: "pipelines/streaming_si/ktrain_entry.sh"
    CODE_PREFIX: "__OWNER__/liveinterpret_training_pipelines"
    NVME_MOUNT: "/nvme"

    # 模型（HF 格式目录，先上传到 S3；S3 桶产物目录按新阶段编号，2026-10 由 S1-1a/ / S3-w/ 改名为 S3/ / S4-w/）：
    # v2 链（1031 数据 en/zh/ja/ko）产物在 trained_streaming_si_4b_enzhjako/ 下：
    #   S3-w_init_1031_v2 -> S3-w_1031v2_ckpt2500 -> S3_1031v2_ckpt18607 -> S4-w(本次) -> S4
    # S4-w（已完成，门 A 10 方向全 PASS，2026-10-28 21:52）：S3 v2 的最终 checkpoint-18607
    # S4（当前）：S4-w v2 的最终 checkpoint-2500（任务 si-s4w-3c4c，final loss 3.3755）
    SI_STAGE: "s4"
    MODEL_PATH: "s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/model_checkpoint/streaming_si_swift/trained_streaming_si_4b_enzhjako/S4-w_1031v2_ckpt2500/"
    # 两个变量按顺序一一对应（第 i 个 parquet 目录配第 i 个 tar 目录）
    # 与 ktrainjob_streaming_si_s2_4n_1031.yaml 保持一致：10 方向 + 噪声 2 + 同语言对 4 + machine 3
    SI_P2_DATA_DIRS: >-
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/en2zh/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/zh2en/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/en2ja/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/ja2en/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/en2ko/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/ko2en/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/ja2zh/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/zh2ja/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/ko2zh/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/zh2ko/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/negative_noise/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/negative_noise_dns5/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/en2en/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/zh2zh/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/ja2ja/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/ko2ko/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/open_data_0803_fortrain/machine_0_shard/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/open_data_0803_fortrain/machine_1_shard/p2_fsq_v3/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/open_data_0803_fortrain/machine_2_shard/p2_fsq_v3/
    SI_P2_WAV_DIRS: >-
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/en2zh/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/zh2en/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/en2ja/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/ja2en/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/en2ko/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/ko2en/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/ja2zh/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/zh2ja/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/ko2zh/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/zh2ko/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/negative_noise/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/negative_noise_dns5/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/en2en/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/zh2zh/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/ja2ja/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/Speech2Speech/ko2ko/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/open_data_0803_fortrain/machine_0_shard/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/open_data_0803_fortrain/machine_1_shard/p2_source_wav/
      s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/open_data_0803_fortrain/machine_2_shard/p2_source_wav/

    # 输出子目录 s4w_s2st/（s4-w）或 s4_s2st/（s4）（改名前为 s3_w/、s3_s2st/）；多节点自动 --save_on_each_node。不要设 OUTPUT_DIR。
    OUTPUT_ROOT: "/nvme/output/__OWNER__/streaming_si"
    # SI_EXTRA_ARGS: "--resume_from_checkpoint /nvme/output/__OWNER__/streaming_si/s4_s2st/.../checkpoint-N"

    # -------------------------------------------------------------------------
    # 训练参数。默认值在 train_s2st.sh（两个阶段每卡 16；s4-w lr 3e-4、2500 步、warmup 3%；
    #   s4 lr 5e-5、1 epoch）。全局 batch = 每卡 × 8 × numNodes，改节点数时步数随之变化。
    #
    # S4-w（任务 si-s3w-last-*，2 节点）：用 train_s2st.sh 默认值，去掉下面 S4 的覆盖项即可
    #   （每卡 16 × 16 卡 = 全局 256，2500 步约 64 万样本）。
    #
    # S4（当前）：
    #   源项目 S3：8 卡 × 每卡 16 = 全局 128、lr 5e-5、无 warmup、文本:语音 = 1:1。
    #   第一版（si-s3-3n-uurj，3 节点）：每卡 16 / 全局 384 / lr 8e-5（平方根缩放）/ 1:1。实测文本 loss 随 lr 升高
    #     单调上涨：250 步 0.577（acc 84.6%）-> 1500 步（到峰值）0.713 -> 4300 步 0.815（acc 80.1%），
    #     语音 loss 3.19 -> 3.08。语音 CE 约是文本 CE 的 5 倍，thinker 的梯度主要来自语音，翻译能力被侵蚀。
    #     显存峰值 39.4 GiB（第 1 步即最长一批），GPU 利用率约 80%。
    #   本版：每卡 32；lr 不随 batch 放大，取源值 5e-5；文本权重 1.5；warmup 3%。
    #     3 节点：全局 768，约 2.5 万步，warmup 约 750 步（样本量与第一版的 1500 步相同）。
    #     2 节点：全局 512，约 3.75 万步，warmup 约 1100 步（约 58 万样本，与第一版相当）。
    #   观察：文本 loss 应稳定在 0.6 附近（第一版起点 0.58）；若仍持续上涨，再降 lr 或提高文本权重。
    #
    # 【2026-10-28 权重与裁剪调整】基于梯度探针（S2 ckpt56924 Thinker + S3 v0 talker 合成起点，
    #   9 方向 × 4 batch 实测，见当次会话记录）：
    #   - Thinker 上文本/语音两路梯度余弦 ≈ ±0.01（近正交，无方向冲突）——"2.5 保护翻译"缺乏依据；
    #   - w=1 时文本梯度已是语音的 ~2.1 倍，2.5 会放大到 ~5.2 倍；
    #   - clip=1.0 下合成范数 8~16，每步都被裁剪：w=2.5 时 talker 有效步长只有 w=1 的 ~53%，
    #     而 talker 恰是 S4 的主要学习对象。
    #   故文本权重 2.5 -> 1.5，max_grad_norm 1.0 -> 5.0（放宽后裁剪不再是主导，text_w 改变的
    #   是各模块相对份额而非整体步长；lr 5e-5 不变——裁剪放宽后有效步长会变大，需盯首 2000 步
    #   的 grad_norm 与 text_loss，若 grad_norm 持续 >5 或 text_loss 上行过快，回收 max_grad_norm）。
    # -------------------------------------------------------------------------
    # ---- 【S4（2026-10-28 恢复）】每卡 32 / lr 5e-5 / 文本权重 1.5 / clip 5.0 / warmup 3%
    #      （权重与裁剪依据见上面 2026-10-28 探针注释；跑 S4-w 时注释掉这 5 行）：
    PER_DEVICE_TRAIN_BATCH_SIZE: "32"
    LEARNING_RATE: "5e-5"
    SI_TEXT_LOSS_WEIGHT: "1.5"
    MAX_GRAD_NORM: "5.0"
    WARMUP_RATIO: "0.03"
    GROUP_BY_LENGTH: "true"
    DATASET_NUM_PROC: "12"        # 每个 rank 都跑一遍 1928 万行的预处理
    DATALOADER_NUM_WORKERS: "8"
    # MAX_STEPS: "100"        # 首次试跑可打开

    NCCL_IB_DISABLE: "0"
    NCCL_SOCKET_IFNAME: "^lo,docker0"
    FI_PROVIDER: "efa"
    NCCL_DEBUG: "INFO"
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "300"
    FI_EFA_FORK_SAFE: "1"
    FI_EFA_USE_DEVICE_RDMA: "1"
    NCCL_DEBUG_SUBSYS: "INIT,NET,ENV"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
