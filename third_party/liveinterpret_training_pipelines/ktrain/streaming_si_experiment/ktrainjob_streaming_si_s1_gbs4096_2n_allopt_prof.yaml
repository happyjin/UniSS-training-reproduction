# =============================================================================
# 【S1 GBS=4096 基线 · torchrun + ZeRO-2 · 无 liger】
# 本组对照（照 docs/GBS512_GBS4096_BASELINE_ABCD_200STEP_TRAINING_METRICS.md 的口径）：
#   本列  GBS4096 / torchrun / zero2 / 无 liger     <- 基线
#   下一列 GBS4096 / torchrun / zero1 / liger        <- 变量 = zero stage + liger
# 已有参照：si-s1-tr-5jc4（GBS1024 / zero2 / 无 liger），稳态 2.28 s/it、显存 21.6 GiB。
#
# 与 ktrainjob_streaming_si_s1_bench.yaml 的差异：
#   - PER_DEVICE 64 -> 256（GBS 1024 -> 4096），GA 保持 1
#   - LOGGING_STEPS=10（每 10 步一条指标）
#   - OUTPUT_ROOT 子目录 streaming_si_gbs4096_2n_allopt_prof
#
# 【提交】
#   python3 ktrain/preflight_streaming_si.py --yaml ktrain/ktrainjob_streaming_si_s1_gbs4096_base.yaml --skip-data
#   bash .codebuddy/training-ops-plugin/skills/ktrain-job-ops/scripts/submit.sh \
#       --yaml ktrain/ktrainjob_streaming_si_s1_gbs4096_base.yaml \
#       --repo <repo> --launcher ktrain/launch_train.sh \
#       --aws-creds-secret aws-local-creds --job-name-prefix si-s1-g4k \
#       --task-deadline 'si-s1-data=21600'
# =============================================================================
# =============================================================================
# KtrainJob (ktrain.oit-svc.com/v1alpha2) — 经 ktrain CLI 提交，H200 集群。
#
# streaming_si S1（Talker 发声预训练：文本 -> FSQ speech token，源项目 S1-0）·
# torchrun + DeepSpeed ZeRO-2 · 数据从 S3 同步到各节点 NVMe
#
# s1：cond=text_only，训整个 talker；MODEL_PATH = 导出的基座（可与 S2 并行）。
# 接入 thinker 语义的 S3-w / S3 用 ktrain/ktrainjob_streaming_si_s3.yaml（同一份 Emilia 数据）。
#
# 【数据（S3 实测 2026-09-29）】
#   s3://stevehguo-ap-southeast-3/.../open_data_0803_fortrain/TTS/emilia_fsq_v3/s1_emilia_fsq_v3/
#   2060 个 parquet（fsq-EN-B*.parquet 等），20.5 GiB，同步到每个节点
#   /nvme/speech_model_backup/stevehguo/data_fortrain/open_data_0803_fortrain/TTS/emilia_fsq_v3/s1_emilia_fsq_v3/
#   注意 parquet 在 emilia_fsq_v3/ 下一层的 s1_emilia_fsq_v3/ 里。
#   数据必须是 v3 代 FSQ（CosyVoice3 tokenizer + 正确 mel 前端），旧代码本训错不会报错。
#
# 【链路】submit.sh 同步代码与数据 → launch_train.sh → pipelines/streaming_si/ktrain_entry.sh
#        （转换 SI_S1_DATA 路径、按 SI_STAGE 分发）→ train_tts.sh → swift sft（torchrun numNodes×8）
#
# 【提交】
#   bash .codebuddy/training-ops-plugin/skills/ktrain-job-ops/scripts/submit.sh \
#       --yaml ktrain/ktrainjob_streaming_si_s1.yaml \
#       --repo <repo> --launcher ktrain/launch_train.sh \
#       --aws-creds-secret aws-local-creds \
#       --job-name-prefix si-s1 \
#       --task-deadline 'si-s1-data=21600'
#
# 【提交前确认】白名单节点（与 numNodes 一致）、MODEL_PATH 选 0.6B 还是 4B（见 env 注释）、CODE_PREFIX / OUTPUT_ROOT / owner。
# =============================================================================
apiVersion: ktrain.oit-svc.com/v1alpha2
kind: KtrainJob
metadata:
  name: __JOB_NAME__
  namespace: speech-h200
  annotations:
    ktrain.oit-svc.com/owner: junyaoyang
    ktrain.oit-svc.com/render-extra: >-
      {"hyperpod": true, "no_metrics_sidecar": true,
       "efa_devices_per_worker": 32,
       "tolerations": [{"key": "node-type", "operator": "Equal", "value": "gpu", "effect": "NoSchedule"}],
       "node_selector": {"node.kubernetes.io/instance-type": "ml.p5e.48xlarge"},
       "affinity": {
         "nodeAffinity": {
           "requiredDuringSchedulingIgnoredDuringExecution": {
             "nodeSelectorTerms": [{"matchExpressions": [
               {"key": "kubernetes.io/hostname", "operator": "In",
                "values": ["hyperpod-i-03e7d1f6d95864e1a", "hyperpod-i-08e3257c716579618"]}
             ]}]
           }
         }
       },
       "extra_volumes": [
         {"name": "s3all", "persistentVolumeClaim": {"claimName": "speech-h200-s3-pvc", "readOnly": true}},
         {"name": "nvme", "hostPath": {"path": "/opt/dlami/nvme", "type": "Directory"}}
       ],
       "extra_volume_mounts": [
         {"name": "s3all", "mountPath": "/s3all", "readOnly": true},
         {"name": "nvme", "mountPath": "/nvme"}
       ],
       "shm_size": "64Gi"
      }
spec:
  framework: pytorch
  # streaming_si 镜像（ktrain/image/Dockerfile.streaming-si）：v9 + fla / causal-conv1d 加速核 + CosyVoice 声码器依赖，
  # 0.6B 与 4B 两个变体通用（4B 的线性注意力走加速核）；torch / TE / EFA 与 v9 相同，训练行为不变。
  image: 124355679795.dkr.ecr.ap-southeast-3.amazonaws.com/ktrain/speech-language-model:p5-cuda12.8-torch2.8-te-v9-ray2-nsys-liger-streaming-si-v1
  command: ["bash", "-c", "/opt/launcher/launch_train.sh"]
  numNodes: 2                  # = 白名单节点数
  resources:
    cpu: "135"
    memory: 1350Gi
    gpu: 8
  env:
    TRAIN_SCRIPT: "pipelines/streaming_si/ktrain_entry.sh"
    CODE_PREFIX: "__OWNER__/liveinterpret_training_pipelines"
    NVME_MOUNT: "/nvme"
    SI_MODEL_TYPE: "streaming_si_4b"
    SI_CODE_CHECK: "1"

    # ---- 本列 = 全优化叠加（zero1 + liger + SKIP_THINKER）----
    # 设计意图：一次拿到两个对照
    #   E vs D(2n_base_prof, zero2/无liger/无skip) = 优化总收益
    #   E vs B(si-s1-l4k-sori, zero1+liger/无skip) = SKIP_THINKER 的净收益（单变量，
    #        因为 B 已经是 zero1+liger，两列只差 skip）
    # 三项优化：
    #   1) ZeRO-1（经 DEEPSPEED 指向 zero1_prof.json）
    #   2) liger 融合核（talker 的 RMSNorm+SwiGLU；thinker 因 liger 0.5.10 无
    #      apply_liger_kernel_to_qwen3_next 不融合，见 1.5.3）
    #   3) SKIP_THINKER（S1 跳过 4B thinker 主干前向，见第 3 节）
    STREAMING_SI_LIGER_OPS: "1"
    SI_SKIP_THINKER: "1"
    # 与单机列（1n_base / 1n_skipthinker）同口径：wall_clock_breakdown + flops_profiler。
    # ⚠️ profiler 的 FLOPs 对 Triton 核统计不全（实测 fwd flops 不扣被跳过的 thinker），
    #    只看 latency 分解，不用它推 MFU。
    DEEPSPEED: "/s3all/__OWNER__/liveinterpret_training_pipelines/ktrain/deepspeed/zero1_prof.json"

    # -------------------------------------------------------------------------
    # 模型（HF 格式目录，export_base_models.sh 导出，已上传；两者都是未训练的基座，自带 speech_decoder/）：
    #   base_streaming_si     Thinker Qwen3-0.6B + Talker 0.1B（1.89B 参数含 Voxtral 音频塔，4.9 GiB）
    #   base_streaming_si_4b  Thinker Qwen3.5-4B + Talker 0.6B（6.32B 参数，13.1 GiB）
    #   s1 用上面的基座。S3-w 的起点（merge_stage_checkpoints.py 合并 S2 thinker + S1 talker）见 ktrainjob_streaming_si_s3.yaml。
    # -------------------------------------------------------------------------
    # MODEL_PATH: "s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/model_checkpoint/streaming_si_swift/base_streaming_si/"
    MODEL_PATH: "s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/model_checkpoint/streaming_si_swift/base_streaming_si_4b/"

    SI_STAGE: "s1"
    SI_S1_DATA: "s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/open_data_0803_fortrain/TTS/emilia_fsq_v3/s1_emilia_fsq_v3/"

    # 输出子目录 s1_tts/（2026-10 改名前为 s1-0/）；多节点自动 --save_on_each_node。不要设 OUTPUT_DIR。
    OUTPUT_ROOT: "/nvme/output/__OWNER__/streaming_si_gbs4096_2n_allopt_prof"
    # SI_EXTRA_ARGS: "--resume_from_checkpoint /nvme/output/__OWNER__/streaming_si/s1_tts/.../checkpoint-N"

    # -------------------------------------------------------------------------
    # 训练参数：默认值在 train_tts.sh（每卡 32、lr 1e-4、2 epoch）。
    # 源项目是单机 4 卡 × 32 = 全局 128；16 卡用默认值时全局 512（步数为源的 1/4）。
    # 要与源对齐就改成 PER_DEVICE_TRAIN_BATCH_SIZE: "8"、去掉 LEARNING_RATE（16 × 8 = 128，lr 1e-4）。
    #
    # 当前取吞吐优先：4B 的 S1 在每卡 32 时显存仅约 22/140 GB、功耗未满，故每卡 64 → 全局 1024
    # （约 7.4 万步）；lr 按 batch 平方根从 1e-4（全局 512）放大到 1.4e-4。
    # 重启后看 train_speed(s/it)：低于 2 s/it 说明吞吐有提升，接近 2 就改回 32 / 1e-4。
    # -------------------------------------------------------------------------
    # GBS=4096 = 16 卡 × 256 × GA1。参照 docs/GBS512_GBS4096_BASELINE_ABCD_200STEP_
    # TRAINING_METRICS.md 的 C/D 列口径（GBS 4096 / 200 step），但 per_device 拆分不照搬
    # D 列的 32×GA8：那是 omnispeak 的显存特性（D 列 82.77 GiB）。streaming_si 在
    # 每卡 64 时只占 21.6/141 GiB（si-s1-tr-5jc4 实测），32×GA8 会掉到约 11 GiB、更浪费，
    # 且 GA=8 把 s/it 拉长 8 倍。256×GA1 预估显存落在 D 列同量级，吞吐也更高。
    PER_DEVICE_TRAIN_BATCH_SIZE: "256"
    GRADIENT_ACCUMULATION_STEPS: "1"
    LEARNING_RATE: "1.4e-4"   # 与 GBS1024 基线保持一致：本组对照只看 s/it / 显存，不比收敛速度
    DATASET_NUM_PROC: "32"    # 数据集 Map 并行进程数（默认 4），缩短训练前预处理时间
    # 【不设 MAX_STEPS】照 docs/GBS512_GBS4096_BASELINE_ABCD_200STEP_TRAINING_METRICS.md
    # 的口径（C 列"--force（无 TRAIN_STEP_LIMIT）"、"跑满200步人工停止"，实际 203/210/220 步）。
    # 设 MAX_STEPS=200 会让 cosine_with_min_lr 把整个衰减压进 200 步（实测 si-s1-g4k-t5od
    # 在 step200 时 lr 已掉到 1.4e-5），那条 loss 曲线不等于正式训练的前 200 步，不可用于对照。
    # 这里按 NUM_TRAIN_EPOCHS=2 的真实总步数（≈18.6k）走 schedule，跑到 200 步后人工 ktrain job stop。
    LOGGING_STEPS: "10"      # 每 10 步一条指标（默认 50），与参考文档逐 step 表口径一致

    NCCL_IB_DISABLE: "0"
    NCCL_SOCKET_IFNAME: "^lo,docker0"
    FI_PROVIDER: "efa"
    NCCL_DEBUG: "INFO"
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "300"
    FI_EFA_FORK_SAFE: "1"
    FI_EFA_USE_DEVICE_RDMA: "1"
    NCCL_DEBUG_SUBSYS: "INIT,NET,ENV"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
