# S4 FLEURS test 子集评测 — 补齐 Hy-SimulMT 对标基准（中英双向）
#   口径与 baseline_eval_apis 一致：整段 · greedy · --no_vocoder（本轮只评文本侧）
#   test 子集 = lance 里 fleurs 且 contribution_id 含 test 不含 dev
# GPU 全忙时 Pending 排队，释放后自动执行；结果上传 S3 _eval_tmp/。
apiVersion: batch/v1
kind: Job
metadata:
  name: s4-fleurs-eval
  namespace: speech-h200
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - {key: node-type, operator: Equal, value: gpu, effect: NoSchedule}
      nodeSelector:
        node.kubernetes.io/instance-type: ml.p5e.48xlarge
      containers:
        - name: eval
          image: 124355679795.dkr.ecr.ap-southeast-3.amazonaws.com/ktrain/speech-language-model:p5-cuda12.8-torch2.8-te-v9-streaming-si-v1
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              W=/work
              mkdir -p $W && cd $W
              echo "[1/4] 下载 bundle（代码包 + 数据包分开，kubectl cp 大文件不稳改走 S3）..."
              AWS_DEFAULT_REGION=ap-southeast-3 aws s3 cp \
                s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/_eval_tmp/s4_ja_bundle.tar - | tar xf - repo
              AWS_DEFAULT_REGION=ap-southeast-3 aws s3 cp \
                s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/_eval_tmp/fleurs_wav.tar - | tar xf -
              if [ ! -f $W/model/model-00003-of-00003.safetensors ]; then
                echo "[2/4] 下载模型 S4_1031v2_ckpt93767..."
                AWS_DEFAULT_REGION=ap-southeast-3 aws s3 sync \
                  s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/model_checkpoint/streaming_si_swift/trained_streaming_si_4b_enzhjako/S4_1031v2_ckpt93767 \
                  $W/model --only-show-errors
              else
                echo "[2/4] 模型已缓存"
              fi
              echo "[3/4] 推理 FLEURS test（整段 · greedy）..."
              cd $W/repo
              /opt/venv/bin/python custom/streaming_si/inference/infer_s2st.py \
                --model_dir $W/model \
                --input_jsonl $W/input_fleurs.jsonl \
                --out_dir $W/out \
                --no_vocoder --device cuda:0
              echo "[4/4] 上传结果..."
              AWS_DEFAULT_REGION=ap-southeast-3 aws s3 cp $W/out/results.jsonl \
                s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/_eval_tmp/s4_fleurs_results.jsonl --only-show-errors
              echo "EVAL_DONE"
          env:
            - {name: AWS_DEFAULT_REGION, value: "ap-southeast-3"}
          envFrom:
            - secretRef: {name: aws-local-creds}
          resources:
            requests: {cpu: "16", memory: "64Gi", nvidia.com/gpu: "1"}
            limits: {cpu: "16", memory: "64Gi", nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: work, mountPath: /work}
      volumes:
        - name: work
          emptyDir: {sizeLimit: 200Gi}
