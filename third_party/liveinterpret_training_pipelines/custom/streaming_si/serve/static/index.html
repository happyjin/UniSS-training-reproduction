<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>同传实时推理 · 调试页</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --fg: #e6e9ef; --dim: #8b93a3;
    --accent: #4c8dff; --ok: #3ecf8e; --warn: #f2b544; --err: #ef5b62;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 12.5px; margin-bottom: 20px; }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
          border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--dim); background: var(--panel); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--err); }
  label { font-size: 12.5px; color: var(--dim); }
  select { background: var(--panel); color: var(--fg); border: 1px solid var(--line);
           border-radius: 8px; padding: 5px 8px; font-size: 13px; }
  .drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 34px 16px; text-align: center;
          background: var(--panel); cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: #1a1f29; }
  .drop b { color: var(--accent); }
  .drop small { display: block; color: var(--dim); margin-top: 6px; font-size: 12px; }
  .row { border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
         padding: 14px 16px; margin-top: 12px; }
  .row head { display: block; }
  .row .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .name { font-weight: 600; font-size: 13.5px; word-break: break-all; }
  .stat { color: var(--dim); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .text { margin: 10px 0 0; font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
  .text.pending { color: var(--dim); }
  .badge { font-size: 11.5px; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--dim); }
  .badge.warn { color: var(--warn); border-color: #4a3d1e; }
  .badge.err { color: var(--err); border-color: #4a2226; }
  audio { width: 100%; margin-top: 10px; height: 34px; }
  .meta { margin-top: 8px; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--dim); text-align: center; padding: 28px 0; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>同传实时推理 · 调试页</h1>
  <div class="sub">上传一段已经切好的语音（≤30s，wav / mp3 / m4a），返回译文与 24kHz 合成语音。</div>

  <div class="bar">
    <span class="pill"><span class="dot" id="dot"></span><span id="health">连接中…</span></span>
    <label for="lang">目标语言</label>
    <select id="lang">
      <option value="zh">中文 (zh)</option>
      <option value="en">English (en)</option>
    </select>
  </div>

  <div class="drop" id="drop">
    拖入音频文件，或 <b>点击选择</b>
    <small>可以一次选多个，按顺序逐个翻译</small>
    <input type="file" id="file" accept="audio/*,.wav,.mp3,.m4a,.flac" multiple hidden>
  </div>

  <div id="list"></div>
  <div class="empty" id="empty">还没有请求</div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const list = $('#list');
let audioCtx = null;

function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

async function pollHealth() {
  const dot = $('#dot'), label = $('#health');
  try {
    const r = await fetch('/health');
    const h = await r.json();
    const ready = h.ready;
    dot.className = 'dot ' + (ready ? 'ok' : 'err');
    const dev = h.device || '-';
    const q = h.queue_depth != null ? ` · 队列 ${h.queue_depth}` : '';
    const done = h.stats && h.stats.done != null ? ` · 已处理 ${h.stats.done}` : '';
    label.textContent = ready ? `${dev} 就绪${q}${done}` : '未就绪';
  } catch (e) {
    dot.className = 'dot err';
    label.textContent = '服务不可达';
  }
}
pollHealth();
setInterval(pollHealth, 5000);

const drop = $('#drop'), fileInput = $('#file');
drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', (e) => {
  e.preventDefault(); drop.classList.remove('over');
  handle([...e.dataTransfer.files]);
});
fileInput.addEventListener('change', () => { handle([...fileInput.files]); fileInput.value = ''; });

function addRow(file) {
  $('#empty').style.display = 'none';
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `
    <div class="top">
      <span class="name"></span>
      <span class="stat">等待中…</span>
    </div>
    <p class="text pending">…</p>
    <div class="meta"></div>
  `;
  row.querySelector('.name').textContent = file.name;
  list.prepend(row);
  return row;
}

async function handle(files) {
  for (const f of files) {
    const row = addRow(f);
    const stat = row.querySelector('.stat');
    const text = row.querySelector('.text');
    const meta = row.querySelector('.meta');
    const t0 = performance.now();
    stat.textContent = '上传中…';

    const qs = new URLSearchParams({ tgt_lang: $('#lang').value });

    try {
      const buf = await f.arrayBuffer();
      const res = await fetch('/v1/translate?' + qs.toString(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: buf,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));

      const e2e = (performance.now() - t0).toFixed(0);
      stat.textContent = `${data.infer_ms} ms`;
      text.classList.remove('pending');
      text.textContent = data.text || '（空译文）';

      const bits = [];
      bits.push(`源 ${data.source_sec}s`);
      if (data.audio_sec) bits.push(`语音 ${data.audio_sec}s`);
      bits.push(`排队 ${data.queue_ms}ms`);
      bits.push(`推理 ${data.infer_ms}ms`);
      bits.push(`端到端 ${e2e}ms`);
      if (data.truncated) bits.push('⚠ 音频被截断');
      meta.textContent = bits.join(' · ');

      if (data.status && data.status !== 'ok') {
        const b = document.createElement('span');
        b.className = 'badge warn'; b.textContent = data.status;
        row.querySelector('.top').appendChild(b);
      }
      if (data.audio_b64) playAudio(row, data.audio_b64, data.sample_rate || 24000);
    } catch (e) {
      stat.textContent = '失败';
      text.classList.remove('pending');
      text.textContent = String(e.message || e);
      text.classList.add('pending');
      const b = document.createElement('span');
      b.className = 'badge err'; b.textContent = 'error';
      row.querySelector('.top').appendChild(b);
    }
  }
}

function playAudio(row, b64, sr) {
  const bin = atob(b64);
  const n = bin.length >> 1;
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const i16 = new Int16Array(bytes.buffer, 0, n);
  const f32 = new Float32Array(n);
  for (let i = 0; i < n; i++) f32[i] = i16[i] / 32768;
  const ab = ctx().createBuffer(1, n, sr);
  ab.copyToChannel(f32, 0);
  const src = ctx().createBufferSource();
  src.buffer = ab;
  src.connect(ctx().destination);
  src.start();
  row.dataset.playing = '1';

  const audio = document.createElement('audio');
  audio.controls = true;
  const wavBuf = encodeWav(f32, sr);
  audio.src = URL.createObjectURL(new Blob([wavBuf], { type: 'audio/wav' }));
  row.appendChild(audio);
}

function encodeWav(f32, sr) {
  const n = f32.length, buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true);
  dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) dv.setInt16(44 + i * 2, Math.max(-1, Math.min(1, f32[i])) * 0x7fff, true);
  return buf;
}
</script>
</body>
</html>
