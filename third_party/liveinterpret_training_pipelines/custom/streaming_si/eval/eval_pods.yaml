apiVersion: v1
kind: Pod
metadata:
  name: si-eval-6g
  namespace: speech-h200
spec:
  nodeSelector:
    kubernetes.io/hostname: hyperpod-i-03e7d1f6d95864e1a
  restartPolicy: Never
  tolerations:
    - {effect: NoSchedule, key: node-type, operator: Equal, value: gpu}
    - {effect: NoSchedule, key: nvidia.com/gpu, operator: Exists}
  containers:
    - name: main
      image: 124355679795.dkr.ecr.ap-southeast-3.amazonaws.com/ktrain/speech-language-model:p5-cuda12.8-torch2.8-te-v9-streaming-si-v1
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: "48", memory: 360Gi, nvidia.com/gpu: "6"}
        limits: {cpu: "48", memory: 360Gi, nvidia.com/gpu: "6"}
      volumeMounts:
        - {name: nvme, mountPath: /nvme}
        - {name: fsx, mountPath: /fsx}
        - {name: shm, mountPath: /dev/shm}
  volumes:
    - name: nvme
      hostPath: {path: /opt/dlami/nvme, type: Directory}
    - name: fsx
      persistentVolumeClaim: {claimName: speech-h200-fsx-pvc}
    - name: shm
      emptyDir: {medium: Memory, sizeLimit: 48Gi}
