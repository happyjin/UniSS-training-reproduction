<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>训练数据全流程 · 每环节输入/输出格式 + 跨 Repo 归属</title>
<style>
  body{margin:0;background:#0e1016;color:#e6eaf2;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;}
  .wrap{max-width:1280px;margin:0 auto;padding:18px 14px 30px;}
  h1{font-size:22px;color:#fff;margin:0 0 4px;}
  .sub{color:#8b93a7;font-size:13px;margin:0 0 12px;}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:#8b93a7;margin-bottom:6px;}
  .legend .k{display:inline-flex;align-items:center;gap:6px;}
  .legend .sw{width:16px;height:16px;border-radius:4px;display:inline-block;}
  .legend .ln{width:24px;height:0;border-top:3px dashed #475569;display:inline-block;}
  svg{width:100%;height:auto;display:block;}
  text{font-family:inherit;}
</style>
</head>
<body>
<div class="wrap">
  <h1>训练数据全流程：每环节「输入格式 → 变换 → 输出格式」+ 跨 Repo 归属</h1>
  <p class="sub">每个阶段 = <span style="color:#94a3b8">灰卡(输入格式)</span> → <span style="color:#22d3ee">↓变换</span> → <span style="color:#cbd5e1">彩卡(输出格式)</span>；右栏标<b>归属</b>。
     <span style="color:#c084fc">紫=Curion 应做</span> ｜ <span style="color:#60a5fa">蓝=我们 repo 应保留</span> ｜ <span style="color:#f87171">红=当前越界重复</span></p>
  <div class="legend">
    <span class="k"><i class="ln"></i>输入格式（灰·虚线）</span>
    <span class="k"><i class="sw" style="background:#a855f7"></i>Curion 输出</span>
    <span class="k"><i class="sw" style="background:#34d399"></i>Curion codec 输出</span>
    <span class="k"><i class="sw" style="background:#3b82f6"></i>我们 repo 输出</span>
    <span class="k"><i class="sw" style="background:#8b5cf6"></i>训练步</span>
    <span class="k" style="color:#a7f3d0">训练前=data_preprocess，训练中=dataloader</span>
  </div>

<svg viewBox="0 0 1280 3340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aCyan" markerWidth="11" markerHeight="11" refX="7.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#22d3ee"/></marker>
  </defs>

  <!-- ================= 顶部：通用链路 ================= -->
  <rect x="20" y="14" width="1240" height="86" rx="12" fill="#1e2433" stroke="#334155"/>
  <text x="40" y="40" fill="#cbd5e1" font-size="15" font-weight="800">📐 通用语音多模态大模型训练数据链路</text>
  <text x="40" y="64" fill="#8b93a7" font-size="12.5">原始资产 → 清洗归一化 → 理解标注(ASR/MT) → 合成(TTS) → 特征编码(data_preprocess) → 样本组装(data_preprocess) → 批处理(dataloader)</text>
  <text x="40" y="86" fill="#8b93a7" font-size="11.5">下方标出每个环节的「输入格式 / 输出格式」。训练前的数据处理统称 data_preprocess，训练 step 中处理数据的环节叫 dataloader。</text>

  <!-- 三列分隔线（固定横向位置） -->
  <g stroke="#2a3142" stroke-width="2" stroke-dasharray="3,6">
    <line x1="252" y1="120" x2="252" y2="3160"/>
    <line x1="744" y1="120" x2="744" y2="3160"/>
  </g>
  <text x="148" y="138" text-anchor="middle" fill="#475569" font-size="11">阶段 / 环节</text>
  <text x="500" y="138" text-anchor="middle" fill="#475569" font-size="11">输入格式 → 变换 → 输出格式</text>
  <text x="1002" y="138" text-anchor="middle" fill="#475569" font-size="11">归属</text>

  <!-- ================= 主体：10 阶段 ================= -->
  <!-- 列位置：左栏 x40(中心148) | 中栏 x270 w460(中心500) | 右栏 x760 w480 -->
  <!-- 阶段块: 输入卡 y=T h72 | 变换 y=T+96 | 输出卡 y=T+106 h130 | 块中心=T+118 -->

  <!-- ===== 1 原始资产 ===== -->
  <g>
    <text x="148" y="258" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="800">①</text>
    <text x="148" y="288" text-anchor="middle" fill="#cbd5e1" font-size="15" font-weight="800">原始资产</text>
    <rect x="270" y="170" width="460" height="72" rx="12" fill="#0f1420" stroke="#475569" stroke-dasharray="5,4"/>
    <text x="292" y="196" fill="#94a3b8" font-size="14" font-weight="700">▶ 输入</text>
    <text x="292" y="222" fill="#cbd5e1" font-size="12">vendor / S3 归档（各语料目录·格式各异，无统一 schema）</text>
    <text x="500" y="266" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">↓ 变换：Curion ingest 归档（仅归一化记录，不重采样）</text>
    <rect x="270" y="276" width="460" height="130" rx="12" fill="#1b2230" stroke="#64748b" stroke-width="2.5"/>
    <text x="292" y="300" fill="#fff" font-size="15" font-weight="800">▼ 输出：🌐 初始数据（异构·未归一化）</text>
    <g font-size="11.5">
      <rect x="292" y="316" width="210" height="26" rx="7" fill="#0f1420" stroke="#475569"/><text x="302" y="334" fill="#e6eaf2">🎵 音频 wav/flac/mp3</text>
      <rect x="514" y="316" width="206" height="26" rx="7" fill="#0f1420" stroke="#475569"/><text x="524" y="334" fill="#e6eaf2">📝 transcript</text>
      <rect x="292" y="348" width="210" height="26" rx="7" fill="#0f1420" stroke="#475569"/><text x="302" y="366" fill="#e6eaf2">🌐 (可选) 目标译文</text>
      <rect x="514" y="348" width="206" height="26" rx="7" fill="#0f1420" stroke="#475569"/><text x="524" y="366" fill="#e6eaf2">🎵 (可选) 目标音频</text>
      <rect x="292" y="380" width="428" height="16" rx="5" fill="#0f1420"/><text x="302" y="392" fill="#8b93a7" font-size="10.5">物理音频 + 文本，尚无统一字段</text>
    </g>
    <rect x="760" y="170" width="480" height="236" rx="12" fill="#64748b" fill-opacity="0.08" stroke="#64748b" stroke-opacity="0.6"/>
    <text x="780" y="200" fill="#cbd5e1" font-size="14" font-weight="800">归属：上游（无 · Curion ingest 输入端）</text>
    <text x="780" y="230" fill="#cbd5e1" font-size="12.5">这就是「初始数据」：物理音频 + 文本，无 schema。</text>
    <text x="780" y="258" fill="#cbd5e1" font-size="12.5">Curion ingestors/ 把它归档成 raw/index + raw/shards，</text>
    <text x="780" y="286" fill="#cbd5e1" font-size="12.5">并记录 source_provider / id / release 血缘列。</text>
    <text x="780" y="318" fill="#fca5a5" font-size="12">⚠ 我们 repo 现在从「curated parquet」直接进，</text>
    <text x="780" y="344" fill="#fca5a5" font-size="12">等于跳过上游、重复消费已加工产物。</text>
    <text x="780" y="378" fill="#8b93a7" font-size="11">注：我们 data_maker 的 examples.parquet 即此层下游形态。</text>
  </g>

  <!-- ===== 2 清洗归一化 ===== -->
  <g>
    <text x="148" y="548" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="800">②</text>
    <text x="148" y="578" text-anchor="middle" fill="#d8b4fe" font-size="15" font-weight="800">清洗归一化</text>
    <rect x="270" y="460" width="460" height="72" rx="12" fill="#0f1420" stroke="#475569" stroke-dasharray="5,4"/>
    <text x="292" y="486" fill="#94a3b8" font-size="14" font-weight="700">▶ 输入</text>
    <g font-size="11.5">
      <rect x="292" y="496" width="210" height="26" rx="7" fill="#0f1420" stroke="#475569"/><text x="302" y="514" fill="#cbd5e1">🎵 原始音频(任意率)</text>
      <rect x="514" y="496" width="206" height="26" rx="7" fill="#0f1420" stroke="#475569"/><text x="524" y="514" fill="#cbd5e1">📝 transcript</text>
    </g>
    <text x="500" y="556" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">↓ 变换：resample / 声道归一 / VAD / 切分</text>
    <rect x="270" y="566" width="460" height="130" rx="12" fill="#1b2230" stroke="#a855f7" stroke-width="2.5"/>
    <text x="292" y="590" fill="#fff" font-size="15" font-weight="800">▼ 输出：🧹 归一化音频样本（Curion processed）</text>
    <g font-size="11.5">
      <rect x="292" y="606" width="210" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="302" y="624" fill="#e9d5ff">🎵 音频 16k/mono</text>
      <rect x="514" y="606" width="206" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="524" y="624" fill="#e9d5ff">📝 transcript</text>
      <rect x="292" y="640" width="428" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="302" y="658" fill="#a7f3d0">duration_ms / sample_rate（免读头可算）</text>
    </g>
    <rect x="760" y="460" width="480" height="236" rx="12" fill="#a855f7" fill-opacity="0.08" stroke="#a855f7" stroke-opacity="0.6"/>
    <text x="780" y="490" fill="#e9d5ff" font-size="14" font-weight="800">归属：Curion processed（clean 算子）</text>
    <text x="780" y="520" fill="#d8b4fe" font-size="12.5">可复用媒体清理，所有下游共享，无模型推理。</text>
    <text x="780" y="548" fill="#d8b4fe" font-size="12.5">输出是稳定的「clean 音频 + 转写」事实表，</text>
    <text x="780" y="576" fill="#d8b4fe" font-size="12.5">供 ASR / MT / TTS 多任务复用。</text>
  </g>

  <!-- ===== 3 理解标注 ===== -->
  <g>
    <text x="148" y="838" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="800">③</text>
    <text x="148" y="868" text-anchor="middle" fill="#d8b4fe" font-size="15" font-weight="800">理解标注</text>
    <rect x="270" y="750" width="460" height="72" rx="12" fill="#0f1420" stroke="#475569" stroke-dasharray="5,4"/>
    <text x="292" y="776" fill="#94a3b8" font-size="14" font-weight="700">▶ 输入</text>
    <g font-size="11.5">
      <rect x="292" y="786" width="210" height="26" rx="7" fill="#0f1420" stroke="#475569"/><text x="302" y="804" fill="#cbd5e1">🎵 src_audio(16k)</text>
      <rect x="514" y="786" width="206" height="26" rx="7" fill="#0f1420" stroke="#475569"/><text x="524" y="804" fill="#cbd5e1">📝 transcript</text>
    </g>
    <text x="500" y="846" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">↓ 变换：ASR(音频→源文) · MT(源文→译文) · 候选选择+质量分</text>
    <rect x="270" y="856" width="460" height="130" rx="12" fill="#1b2230" stroke="#a855f7" stroke-width="2.5"/>
    <text x="292" y="880" fill="#fff" font-size="15" font-weight="800">▼ 输出：🧠 带标注样本（Curion processed/annotations）</text>
    <g font-size="11.5">
      <rect x="292" y="896" width="210" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="302" y="914" fill="#e9d5ff">🎵 src_audio</text>
      <rect x="514" y="896" width="206" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="524" y="914" fill="#e9d5ff">📝 src_text(ASR)</text>
      <rect x="292" y="930" width="428" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="302" y="948" fill="#e9d5ff">📝 tgt_text(MT 译文) · 候选+质量分</text>
    </g>
    <rect x="760" y="750" width="480" height="236" rx="12" fill="#a855f7" fill-opacity="0.08" stroke="#a855f7" stroke-opacity="0.6"/>
    <text x="780" y="780" fill="#e9d5ff" font-size="14" font-weight="800">归属：Curion processed/annotations</text>
    <text x="780" y="810" fill="#d8b4fe" font-size="12.5">多模型候选→选择，质量分写入 annotation。</text>
    <text x="780" y="838" fill="#d8b4fe" font-size="12.5">（我们 repo 的 parquet 已含 src/tgt text，</text>
    <text x="780" y="866" fill="#d8b4fe" font-size="12.5">即此层产物，不应在 data_maker 再生成）</text>
  </g>

  <!-- ===== 4 合成 TTS ===== -->
  <g>
    <text x="148" y="1128" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="800">④</text>
    <text x="148" y="1158" text-anchor="middle" fill="#d8b4fe" font-size="15" font-weight="800">合成 TTS</text>
    <rect x="270" y="1040" width="460" height="72" rx="12" fill="#0f1420" stroke="#475569" stroke-dasharray="5,4"/>
    <text x="292" y="1066" fill="#94a3b8" font-size="14" font-weight="700">▶ 输入</text>
    <g font-size="11.5">
      <rect x="292" y="1076" width="210" height="26" rx="7" fill="#0f1420" stroke="#475569"/><text x="302" y="1094" fill="#cbd5e1">📝 tgt_text</text>
      <rect x="514" y="1076" width="206" height="26" rx="7" fill="#0f1420" stroke="#475569"/><text x="524" y="1094" fill="#cbd5e1">🎵 src_audio</text>
    </g>
    <text x="500" y="1136" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">↓ 变换：TTS 文本 → 目标音频（监督信号来源）</text>
    <rect x="270" y="1146" width="460" height="130" rx="12" fill="#1b2230" stroke="#a855f7" stroke-width="2.5"/>
    <text x="292" y="1170" fill="#fff" font-size="15" font-weight="800">▼ 输出：🔊 带目标音频（Curion processed/shards）</text>
    <g font-size="11.5">
      <rect x="292" y="1186" width="210" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="302" y="1204" fill="#e9d5ff">🎵 src_audio</text>
      <rect x="514" y="1186" width="206" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="524" y="1204" fill="#e9d5ff">📝 src/tgt_text</text>
      <rect x="292" y="1220" width="428" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="302" y="1238" fill="#e9d5ff">🎵 tgt_audio（TTS 合成·可复用资产）</text>
    </g>
    <rect x="760" y="1040" width="480" height="236" rx="12" fill="#a855f7" fill-opacity="0.08" stroke="#a855f7" stroke-opacity="0.6"/>
    <text x="780" y="1070" fill="#e9d5ff" font-size="14" font-weight="800">归属：Curion processed（tts 算子）</text>
    <text x="780" y="1100" fill="#d8b4fe" font-size="12.5">产出可复用目标音频资产，供多训练变体共享。</text>
    <text x="780" y="1128" fill="#d8b4fe" font-size="12.5">TTS 任务只看 text→tgt_audio；</text>
    <text x="780" y="1156" fill="#d8b4fe" font-size="12.5">S2S 还需 src_audio 作模型输入。</text>
  </g>

  <!-- ===== 5 语义宽表 curated ===== -->
  <g>
    <text x="148" y="1418" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="800">⑤</text>
    <text x="148" y="1448" text-anchor="middle" fill="#d8b4fe" font-size="15" font-weight="800">语义宽表</text>
    <text x="148" y="1470" text-anchor="middle" fill="#a855f7" font-size="12">curated</text>
    <rect x="270" y="1330" width="460" height="72" rx="12" fill="#0f1420" stroke="#475569" stroke-dasharray="5,4"/>
    <text x="292" y="1356" fill="#94a3b8" font-size="14" font-weight="700">▶ 输入</text>
    <text x="292" y="1382" fill="#cbd5e1" font-size="11.5">processed 各产物指针：src_audio / src_text / tgt_text / tgt_audio</text>
    <text x="500" y="1426" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">↓ 变换：join selected → 语义宽表（一行一候选）</text>
    <rect x="270" y="1436" width="460" height="130" rx="12" fill="#1b2230" stroke="#a855f7" stroke-width="2.5"/>
    <text x="292" y="1460" fill="#fff" font-size="15" font-weight="800">▼ 输出：🗂️ curated 宽表（Curion curated）</text>
    <g font-size="11">
      <rect x="292" y="1476" width="210" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="302" y="1494" fill="#e9d5ff">record_id / dataset</text>
      <rect x="514" y="1476" width="206" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="524" y="1494" fill="#e9d5ff">src_audio_uri</text>
      <rect x="292" y="1508" width="210" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="302" y="1526" fill="#e9d5ff">src_text / tgt_text</text>
      <rect x="514" y="1508" width="206" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="524" y="1526" fill="#e9d5ff">tgt_audio_uri</text>
      <rect x="292" y="1540" width="428" height="20" rx="6" fill="#0f1420" stroke="#7c3aed"/><text x="302" y="1555" fill="#a7f3d0">duration_ms / speaker / license / lineage</text>
    </g>
    <rect x="760" y="1330" width="480" height="236" rx="12" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.6"/>
    <text x="780" y="1360" fill="#e9d5ff" font-size="14" font-weight="800">应归属：Curion curated</text>
    <text x="780" y="1390" fill="#fca5a5" font-size="12">⚠ 当前越界：我们 repo 的 data_maker</text>
    <text x="780" y="1418" fill="#fecaca" font-size="12">（make_tts / make_s2s）把 parquet join 成</text>
    <text x="780" y="1446" fill="#fecaca" font-size="12">tts/s2s JSONL —— 与此宽表完全重叠。</text>
    <text x="780" y="1478" fill="#8b93a7" font-size="11.5">应：Curion 出 curated，我们 repo 只读，</text>
    <text x="780" y="1504" fill="#8b93a7" font-size="11.5">不再做 join。</text>
  </g>

  <!-- ===== 6 冻结样本集 manifest ===== -->
  <g>
    <text x="148" y="1708" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="800">⑥</text>
    <text x="148" y="1738" text-anchor="middle" fill="#d8b4fe" font-size="15" font-weight="800">冻结样本集</text>
    <text x="148" y="1760" text-anchor="middle" fill="#a855f7" font-size="12">manifest</text>
    <rect x="270" y="1620" width="460" height="72" rx="12" fill="#0f1420" stroke="#475569" stroke-dasharray="5,4"/>
    <text x="292" y="1646" fill="#94a3b8" font-size="14" font-weight="700">▶ 输入</text>
    <text x="292" y="1672" fill="#cbd5e1" font-size="11.5">curated 候选池（多数据集·多任务行集合）</text>
    <text x="500" y="1716" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">↓ 变换：切分/混合/采样权重/prompt recipe → 冻结</text>
    <rect x="270" y="1726" width="460" height="130" rx="12" fill="#1b2230" stroke="#a855f7" stroke-width="2.5"/>
    <text x="292" y="1750" fill="#fff" font-size="15" font-weight="800">▼ 输出：📋 冻结样本集（Curion manifest）</text>
    <g font-size="11.5">
      <rect x="292" y="1766" width="210" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="302" y="1784" fill="#e9d5ff">manifest_row_id</text>
      <rect x="514" y="1766" width="206" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="524" y="1784" fill="#e9d5ff">split(train/valid)</text>
      <rect x="292" y="1800" width="210" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="302" y="1818" fill="#e9d5ff">mixture 权重</text>
      <rect x="514" y="1800" width="206" height="26" rx="7" fill="#0f1420" stroke="#7c3aed"/><text x="524" y="1818" fill="#e9d5ff">prompt_recipe_id</text>
    </g>
    <rect x="760" y="1620" width="480" height="236" rx="12" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.6"/>
    <text x="780" y="1650" fill="#e9d5ff" font-size="14" font-weight="800">应归属：Curion manifest</text>

      <rect x="292" y="2090" width="210" height="26" rx="7" fill="#0f1420" stroke="#10b981"/><text x="302" y="2108" fill="#a7f3d0">code_groups</text>

    <text x="780" y="1996" fill="#fecaca" font-size="12">codec 即 Qwen3-TTS tokenizer 的音频编码输出。</text>

    <text x="780" y="2462" fill="#fecaca" font-size="12">framework-neutral 张量分片 + index。</text>

    <text x="148" y="2718" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="800">⑨</text>

      <rect x="292" y="2810" width="210" height="26" rx="7" fill="#0f1420" stroke="#2563eb"/><text x="302" y="2828" fill="#bfdbfe">right-shift labels</text>

    <text x="780" y="2690" fill="#cbd5e1" font-size="12.5">✅ 这是训练 step 中处理数据的环节 = dataloader：</text>

  <!-- ================= 底部结论 ================= -->
  <rect x="20" y="3176" width="1240" height="158" rx="10" fill="#0e1626" stroke="#334155"/>
  <text x="40" y="3210" fill="#cbd5e1" font-size="15" font-weight="800">🎯 三个关键环节的归类（常规术语）</text>

  <text x="40" y="3272" fill="#a7f3d0" font-size="12.5">💡 两个 tokenizer：<tspan fill="#34d399">codec</tspan> = Qwen3-TTS tokenizer 的音频编码输出（在 ⑦）；<tspan fill="#cbd5e1">input_ids</tspan> = 文本 tokenizer 把 prompt 转成的 token（在 ⑧）。</text>
  <text x="40" y="3298" fill="#a7f3d0" font-size="12.5">问题：当前 template.py 在训练时同时跑了这两个 tokenizer（读 FSx+载模型），每 epoch 重复。目标：⑦⑧ 全归 Curion(data_preprocess)，我们 repo 仅留 ⑨ dataloader。</text>
