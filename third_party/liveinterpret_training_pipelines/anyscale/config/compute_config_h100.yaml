# =============================================================================
# Anyscale compute config — registered as `tokyo-h100-gpu`.
# =============================================================================
# Push a new version:
#   anyscale compute-config create -n tokyo-h100-gpu -f anyscale/config/compute_config_h100.yaml
#
# Schema: https://docs.anyscale.com/reference/compute-config-api#computeconfig
#
# UI: https://console.anyscale.com/cld_z9sb92gg9vewg9l5181hlat7wv/compute-configs/<cpt_id>
# =============================================================================

cloud: anyscale-poc-tokyo-cloud
cloud_resource: k8s-aws-v2-ap-northeast-1

head_node:
  instance_type: 8CPU-32GB
  advanced_instance_config:
    spec:
      containers:
        - name: ray
          resources:
            requests:
              ephemeral-storage: "80Gi"
            limits:
              ephemeral-storage: "80Gi"
          volumeMounts:
            - name: shared-efs
              readOnly: true
              mountPath: /mnt/shared_storage
            - name: data-s3
              mountPath: /data
            - name: fsx-data
              mountPath: /mnt/fsx
      volumes:
        - name: shared-efs
          persistentVolumeClaim:
            readOnly: true
            claimName: aigc-anyscale-efs-pvc
        - name: data-s3
          persistentVolumeClaim:
            claimName: aigc-anyscale-s3-pvc
        - name: fsx-data
          persistentVolumeClaim:
            claimName: aigc-anyscale-fsx-pvc

worker_nodes:
  - name: 8xh100-180cpu-1900gb
    instance_type: 192CPU-2048GB-8xH100-80GB
    min_nodes: 2
    max_nodes: 2
    market_type: ON_DEMAND
    advanced_instance_config:
      spec:
        # ------------ NODE SELECTION ------------
        # Whitelist only nodes with model data (qwen2_5_3b_omnispeak_d, etc.)
        # on /opt/dlami/nvme. Verified 2026-06-28.
        # ----------------------------------------
        # NOTE: whitelist disabled 2026-07-03 (commented out, not deleted).
        # affinity:
        #   nodeAffinity:
        #     requiredDuringSchedulingIgnoredDuringExecution:
        #       nodeSelectorTerms:
        #         - matchExpressions:
        #             - key: kubernetes.io/hostname
        #               operator: In
        #               values:
        #                 - hyperpod-i-088f8cefb5f164975
        #                 - hyperpod-i-05b895a5c05592a29
        # ------------ NODE BLACKLIST (2026-07-05) ------------
        # Exclude the unstable node hyperpod-i-0ae359f42a68edf55 from training.
        # operator: NotIn → scheduler refuses to place worker pods on that node.
        # The other P5 nodes already carry the model on /opt/dlami/nvme, so
        # training is unaffected (min/max_nodes: 2 still schedulable).
        # ----------------------------------------------------
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - hyperpod-i-0ae359f42a68edf55
        volumes:
          - name: shared-efs
            persistentVolumeClaim:
              readOnly: true
              claimName: aigc-anyscale-efs-pvc
          - name: data-s3
            persistentVolumeClaim:
              claimName: aigc-anyscale-s3-pvc
          - name: fsx-data
            persistentVolumeClaim:
              claimName: aigc-anyscale-fsx-pvc
          # ------------ LOCAL NVME (P5 instance store) ------------
          # SageMaker HyperPod LCC creates a RAID0 LV (vg.01/lv_ephemeral)
          # from 8× 3.84 TB NVMe drives, mounted at /opt/dlami/nvme (~27.5 TiB).
          #
          # Purpose:
          #   1. ~25 TiB writable per node — model checkpoints, dataset cache.
          #   2. Survives pod restart / node reboot (instance store persists
          #      until EC2 stop/start).
          #
          # ray uid=1000 across all jobs shares the same uid. MUST stay inside
          # speech-language-model/ subdir; never touch other projects' data.
          - name: local-nvme
            hostPath:
              path: /opt/dlami/nvme
              type: DirectoryOrCreate
        containers:
          - name: ray
            resources:
              limits:
                nvidia.com/gpu: '8'
                ephemeral-storage: "200Gi"
                # EFA RDMA — p5.48xlarge exposes 32 EFA NIC queues.
                # Without this request, aws-efa-k8s-device-plugin does NOT
                # mount /dev/infiniband/uverbsX, and NCCL falls back to TCP
                # on eth0 (~2-3× throughput regression).
                vpc.amazonaws.com/efa: '32'
              requests:
                cpu: 179400m
                memory: 1898Gi
                nvidia.com/gpu: '8'
                vpc.amazonaws.com/efa: '32'
                ephemeral-storage: "200Gi"
            volumeMounts:
              - name: shared-efs
                readOnly: true
                mountPath: /mnt/shared_storage
              - name: data-s3
                mountPath: /data
              - name: fsx-data
                mountPath: /mnt/fsx
              - name: local-nvme
                mountPath: /local
        tolerations:
          - key: nvidia.com/gpu
            effect: NoSchedule
            operator: Exists
          - key: node.anyscale.com/accelerator-type
            value: GPU
            effect: NoSchedule
            operator: Equal

enable_cross_zone_scaling: false
flags:
  cloud_resource_strategy: availability
auto_select_worker_config: false
