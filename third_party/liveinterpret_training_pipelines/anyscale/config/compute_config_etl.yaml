# =============================================================================
# Anyscale compute config — registered as `tokyo-etl` (CPU-only workers, P5).
# =============================================================================
# Push a new version of this config:
#   anyscale compute-config create -n tokyo-etl -f anyscale/config/compute_config_etl.yaml
#
# Schema: https://docs.anyscale.com/reference/compute-config-api#computeconfig
#
# v3 (2026-06-13): 088f8ce 加入黑名单, min_nodes 3→2.
#   - 088f8ce: NvidiaGpuXidRestartApp (Xid 94), 7/8 H100 不健康, 2026-06-13 14:12 UTC
#   - 0ad1ae: NvidiaGpuXidRestartApp (Xid 94), 8/8 H100 不健康, 2026-06-10 09:18 UTC
#   - 仅剩 01c194 + 05b895 两个健康 P5 节点可用
#
# v2 (2026-06-13): 从 head-only 升级为 3×P5 CPU-only worker 集群。
#   - Worker 固定使用 tokyo-h100:18 相同的 3 个 P5 节点（p5.48xlarge），
#     但不请求 GPU/EFA 资源 —— Ray task 以 num_gpus=0 调度。
#   - 挂载 hostPath NVMe (/opt/dlami/nvme → /local) 用于数据预处理产物。
#   - /mnt/fsx（FSx for Lustre）已由 tokyo-h100:18 的 HyperPod LCC 挂载，
#     本 config 不显式声明。
#   - 保留 GPU tolerations 以便 pod 能被调度到 GPU 节点上。
#   - nodeAffinity NotIn 排除 unhealthy P5 节点: 0ad1ae (0/8 GPU), 088f8ce (1/8 GPU).
#
# v1 (historical): head-only（无 worker），用于 ETL 预 staging。
# =============================================================================

cloud: anyscale-poc-tokyo-cloud
cloud_resource: k8s-aws-v2-ap-northeast-1

head_node:
  instance_type: 8CPU-32GB
  advanced_instance_config:
    spec:
      containers:
        - name: ray
          resources:
            requests:
              ephemeral-storage: "80Gi"
            limits:
              ephemeral-storage: "80Gi"
          volumeMounts:
            - name: shared-efs
              readOnly: true
              mountPath: /mnt/shared_storage
            - name: data-s3
              mountPath: /data
      volumes:
        - name: shared-efs
          persistentVolumeClaim:
            readOnly: true
            claimName: aigc-anyscale-efs-pvc
        - name: data-s3
          persistentVolumeClaim:
            claimName: aigc-anyscale-s3-pvc

worker_nodes:
  - name: cpu-only-180cpu-1900gb
    instance_type: 192CPU-2048GB-8xH100-80GB
    # CPU-only on P5 nodes:
    #   - 不请求 nvidia.com/gpu → k8s 不分配 GPU 设备
    #   - 不请求 vpc.amazonaws.com/efa → 无 EFA RDMA
    #   - 保留 GPU tolerations → pod 可调度到 GPU 节点
    #   - 数据预处理是 CPU/IO 密集型，不需要 GPU/EFA
    # v3 (2026-06-13): 新增 088f8ce 到黑名单, min_nodes 3→2
    #   - hyperpod-i-088f8cefb5f164975: NvidiaGpuXidRestartApp (Xid 94, PCI:0000:64:00),
    #     7/8 H100 不健康, allocatable GPU=1 (2026-06-13 14:12 UTC)
    #   - hyperpod-i-0ad1ae8268f330cbb: NvidiaGpuXidRestartApp (Xid 94, PCI:0000:53:00),
    #     8/8 H100 不健康, allocatable GPU=0 (2026-06-10 09:18 UTC)
    #   - 仅剩 2 个健康 P5 节点 (01c194, 05b895) → min/max_nodes 降为 2
    min_nodes: 2
    max_nodes: 2
    market_type: ON_DEMAND
    advanced_instance_config:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - hyperpod-i-0ad1ae8268f330cbb
                        - hyperpod-i-088f8cefb5f164975
        volumes:
          - name: shared-efs
            persistentVolumeClaim:
              readOnly: true
              claimName: aigc-anyscale-efs-pvc
          - name: data-s3
            persistentVolumeClaim:
              claimName: aigc-anyscale-s3-pvc
          - name: fsx-data
            persistentVolumeClaim:
              claimName: aigc-anyscale-fsx-pvc
          - name: local-nvme
            hostPath:
              path: /opt/dlami/nvme
              type: DirectoryOrCreate
        containers:
          - name: ray
            resources:
              limits:
                ephemeral-storage: "200Gi"
              requests:
                cpu: 179400m
                memory: 1898Gi
                ephemeral-storage: "200Gi"
            volumeMounts:
              - name: shared-efs
                readOnly: true
                mountPath: /mnt/shared_storage
              - name: data-s3
                mountPath: /data
              - name: fsx-data
                mountPath: /mnt/fsx
              - name: local-nvme
                mountPath: /local
        tolerations:
          - key: nvidia.com/gpu
            effect: NoSchedule
            operator: Exists
          - key: node.anyscale.com/accelerator-type
            value: GPU
            effect: NoSchedule
            operator: Equal

enable_cross_zone_scaling: false
flags:
  cloud_resource_strategy: availability
auto_select_worker_config: false
