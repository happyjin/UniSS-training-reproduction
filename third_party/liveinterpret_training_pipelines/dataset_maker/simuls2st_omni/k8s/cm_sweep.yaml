  tts_omni_driver.py: "#!/usr/bin/env python3\n\"\"\"TTS_omni \u6570\u636E\u51C6\u5907\
    \u9A71\u52A8\uFF08\u7F8E\u897F\u96C6\u7FA4\uFF09\u3002\n\n\u6BCF\u4E2A worker\
    \ \u8FDB\u7A0B\uFF1A\n  1. boto3 \u5217\u51FA\u4E09\u8DEF\u6E90\u7684 S3 \u5BF9\
    \u8C61\uFF08emilia-zh tar / yodas-jp tar / ko parquet\uFF09\n  2. \u56FA\u5B9A\
    \u79CD\u5B50 shuffle \u540E\u6309 worker_id \u53D6\u6A21\u5206\u7247\uFF08\u9759\
    \u6001\u5747\u8861\uFF0C\u5168\u5C40\u6A21\u6570 NWT\uFF09\n  3. \u9010\u9879\uFF1A\
    \u8DF3\u8FC7\u5DF2\u5B8C\u6210\u7684\uFF08done marker \u65AD\u70B9\u7EED\u8DD1\
    \uFF09\u2192 \u9884\u53D6\u4E0B\u8F7D\u5230 cache \u2192\n     \u590D\u7528 make_tts_dualcodec\
    \ \u7684\u89E3\u7801/\u8FC7\u6EE4/tokenizer \u2192 \u5199 manifest+codes\n  4.\
    \ \u6BCF\u5B8C\u6210\u4E00\u9879 flush \u6240\u6709 writer \u5E76\u843D marker\uFF0C\
    \u5220\u672C\u5730\u7F13\u5B58\n\n\u4E0B\u8F7D\u9884\u53D6\uFF1A\u5904\u7406\u7B2C\
    \ i \u9879\u7684\u540C\u65F6\u5728\u540E\u53F0\u4E0B\u8F7D\u7B2C i+1 \u9879\uFF08\
    \u5E76\u53D1\u5206\u7247\uFF09\uFF0C\u6D88\u9664\u4E0B\u8F7D\u7A7A\u7B49\u2014\
    \u2014\n8.6GB \u7684 yodas tar \u5355\u6D41\u4E0B\u8F7D\u8981 ~6 \u5206\u949F\uFF0C\
    \u8FD9\u662F GPU \u7A7A\u95F2\u7684\u4E3B\u8981\u6765\u6E90\u3002\n\ntokenizer\
    \ \u6BCF\u4E2A worker \u53EA\u521D\u59CB\u5316\u4E00\u6B21\u3002shard \u7F16\u53F7\
    \u4ECE worker_id*100000 \u8D77\uFF0C\n\u591A worker / \u591A Pod / \u591A\u8BED\
    \u8A00\u5171\u5199\u540C\u4E00 out \u6839\u4E0D\u51B2\u7A81\u3002\n\"\"\"\nfrom\
    \ __future__ import annotations\n\nimport argparse\nimport hashlib\nimport json\n\
    import os\nimport random\nimport sys\nimport time\nfrom concurrent.futures import\
    \ ThreadPoolExecutor\n\nimport boto3\nfrom boto3.s3.transfer import TransferConfig\n\
    \nBUCKET = 'stevehguo-ap-southeast-3'\nREGION = 'ap-southeast-3'\nBASE = 'speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/TTS'\n\
    SOURCES = [\n    # (lang, reader, s3 prefix, ext)\n    ('ZH', 'tar_pair', f'{BASE}/zh/emilia/',\
    \ '.tar'),\n    ('JA', 'yodas_seg', f'{BASE}/jp/audio/', '.tar'),\n    ('KO',\
    \ 'parquet', f'{BASE}/ko/patterned_utterance_with_number/data/', '.parquet'),\n\
    ]\n# yodas_seg \u76F4\u63A5\u4EA7\u51FA wav \u7247\u6BB5\uFF08\u5DF2\u5728\u8FED\
    \u4EE3\u5668\u5185\u89E3\u7801\u5207\u6BB5\uFF09\nPREDECODED = {'yodas_seg'}\n\
    # \u5E76\u53D1\u5206\u7247\u4E0B\u8F7D\uFF1A\u5355\u6D41 ~25MB/s\uFF0C8 \u5E76\
    \u53D1\u53EF\u8FBE 100MB/s+\nXFER = TransferConfig(max_concurrency=8, multipart_chunksize=16\
    \ * 1024 ** 2,\n                      multipart_threshold=64 * 1024 ** 2)\n\n\n\
    def _log(msg: str) -> None:\n    print(f'[{time.strftime(\"%m-%d %H:%M:%S\")}]\
    \ {msg}', file=sys.stderr, flush=True)\n\n\ndef wait_gpu_free(need_gb: float =\
    \ 35.0, timeout: float = 7200.0) -> bool:\n    \"\"\"\u5171\u7528 GPU \u65F6\uFF1A\
    \u7B49\u5230\u672C\u5361\u8FD8\u6709 need_gb \u53EF\u7528\u624D\u5904\u7406\u4E0B\
    \u4E00\u9879\u3002\n\n    \u5BBF\u4E3B\u4EFB\u52A1\uFF08\u5982 s5dc \u5408\u6210\
    \u9636\u6BB5\uFF09\u4F1A\u4E34\u65F6\u5403\u6EE1 141GB\uFF0C\u82E5\u4E0D\u7B49\
    \u5F85\u4F1A\u76F4\u63A5 OOM \u5D29\u6389\u3002\n    \"\"\"\n    import torch\n\
    \    t0 = time.time()\n    last = 0.0\n    while True:\n        free, _total =\
    \ torch.cuda.mem_get_info()\n        if free >= need_gb * (1024 ** 3):\n     \
    \       return True\n        el = time.time() - t0\n        if el > timeout:\n\
    \            _log(f'\u7B49 GPU \u663E\u5B58\u8D85\u65F6\uFF08{el / 60:.0f}\u5206\
    \u949F\uFF09\uFF0C\u672C\u8F6E\u653E\u5F03\u7B49\u5F85')\n            return False\n\
    \        if el - last >= 300:\n            last = el\n            _log(f'\u7B49\
    \u5F85 GPU \u663E\u5B58\uFF1A\u53EF\u7528 {free / 1e9:.1f}GB\uFF0C\u9700\u8981\
    \ {need_gb}GB\uFF08\u5DF2\u7B49 {el / 60:.0f}\u5206\u949F\uFF09')\n        time.sleep(10)\n\
    \n\ndef list_items(s3) -> list[dict]:\n    items = []\n    for lang, reader, prefix,\
    \ ext in SOURCES:\n        n0 = len(items)\n        for page in s3.get_paginator('list_objects_v2').paginate(\n\
    \                Bucket=BUCKET, Prefix=prefix):\n            for o in page.get('Contents',\
    \ []):\n                if o['Key'].endswith(ext):\n                    items.append({'lang':\
    \ lang, 'reader': reader,\n                                  'key': o['Key'],\
    \ 'size': o['Size']})\n        _log(f'\u5217\u51FA {lang} {reader}: {len(items)\
    \ - n0} \u4E2A\u5BF9\u8C61')\n    return items\n\n\ndef main() -> None:\n    ap\
    \ = argparse.ArgumentParser()\n    ap.add_argument('--worker-id', type=int, required=True)\n\
    \    ap.add_argument('--nworkers', type=int, required=True)\n    ap.add_argument('--root',\
    \ default='/opt/dlami/nvme/stevehguo/tts_omni')\n    ap.add_argument('--code',\
    \ default='', help='make_tts_dualcodec \u6240\u5728\u76EE\u5F55\uFF08\u9ED8\u8BA4\
    \ root/code\uFF09')\n    ap.add_argument('--device', default='cuda:0')\n    ap.add_argument('--shared-gpu',\
    \ action='store_true',\n                    help='\u4E0E\u5BBF\u4E3B\u4EFB\u52A1\
    \u5171\u7528 GPU\uFF1A\u5904\u7406\u524D\u7B49\u5F85\u8DB3\u591F\u663E\u5B58')\n\
    \    ap.add_argument('--only-keys', default='',\n                    help='\u53EA\
    \u5904\u7406\u8BE5\u6587\u4EF6\u4E2D\u5217\u51FA\u7684 S3 key\uFF08\u6BCF\u884C\
    \u4E00\u4E2A\uFF09\uFF0C\u7528\u4E8E\u7CBE\u786E\u8865\u8DD1\u7F3A\u5931\u9879\
    ')\n    ap.add_argument('--residue-mod', type=int, default=0,\n              \
    \      help='>0 \u65F6\u53EA\u5904\u7406 (\u539F\u59CB\u5E8F\u53F7 %% mod) \u843D\
    \u5728 [min,max] \u7684\u9879\uFF08\u8865\u8DD1\u6F0F\u6389\u7684\u5206\u533A\uFF09\
    ')\n    ap.add_argument('--residue-min', type=int, default=0)\n    ap.add_argument('--residue-max',\
    \ type=int, default=-1)\n    ap.add_argument('--shard-offset-base', type=int,\
    \ default=-1,\n                    help='shard \u8D77\u59CB\u7F16\u53F7\u57FA\u51C6\
    \uFF1B\u9ED8\u8BA4 worker_id*100000\u3002\u8865\u8DD1\u7528\u5927\u57FA\u51C6\u907F\
    \u514D\u8986\u76D6\u65E2\u6709 shard')\n    ap.add_argument('--limit', type=int,\
    \ default=0)\n    args = ap.parse_args()\n\n    code = args.code or os.path.join(args.root,\
    \ 'code')\n    sys.path.insert(0, code)\n    import make_tts_dualcodec as M  #\
    \ noqa: E402\n\n    out = os.path.join(args.root, 'TTS_omni')\n    done_dir =\
    \ os.path.join(args.root, 'done')\n    cache = os.path.join(args.root, 'cache')\n\
    \    os.makedirs(done_dir, exist_ok=True)\n    os.makedirs(cache, exist_ok=True)\n\
    \n    s3 = boto3.client('s3', region_name=REGION)\n    items = list_items(s3)\n\
    \    if args.only_keys:\n        want = {l.strip() for l in open(args.only_keys)\
    \ if l.strip()}\n        items = [it for it in items if it['key'] in want]\n \
    \       _log(f'\u6309\u6E05\u5355\u7B5B\u9009\uFF1A{len(items)}/{len(want)} \u9879\
    \u547D\u4E2D\uFF08\u6E05\u5355 {len(want)} \u9879\uFF09')\n    elif args.residue_mod\
    \ > 0:\n        # \u8865\u8DD1\uFF1A\u53EA\u53D6\u539F\u59CB\u5E8F\u53F7\u843D\
    \u5728\u6307\u5B9A\u6B8B\u5DEE\u533A\u95F4\u7684\u9879\uFF08\u539F\u59CB\u987A\
    \u5E8F = S3 \u5217\u8868\u987A\u5E8F\uFF0C\u786E\u5B9A\u6027\uFF09\n        rmax\
    \ = args.residue_max if args.residue_max >= 0 else args.residue_mod - 1\n    \
    \    keep = [(i, it) for i, it in enumerate(items)\n                if args.residue_min\
    \ <= (i % args.residue_mod) <= rmax]\n        _log(f'\u6B8B\u5DEE\u7B5B\u9009\
    \ mod={args.residue_mod} [{args.residue_min},{rmax}]\uFF1A'\n             f'{len(keep)}/{len(items)}\
    \ \u9879')\n        items = [it for _i, it in keep]\n    random.Random(42).shuffle(items)\n\
    \    mine = [it for i, it in enumerate(items) if i % args.nworkers == args.worker_id]\n\
    \    if args.limit:\n        mine = mine[:args.limit]\n\n    def done_path(it)\
    \ -> str:\n        return os.path.join(done_dir,\n                           \
    \ hashlib.md5(it['key'].encode()).hexdigest()[:16] + '.done')\n\n    todo = [it\
    \ for it in mine if not os.path.exists(done_path(it))]\n    _log(f'worker {args.worker_id}/{args.nworkers}:\
    \ \u5171 {len(items)} \u9879\uFF0C'\n         f'\u6211 {len(mine)} \u9879\uFF0C\
    \u5F85\u5904\u7406 {len(todo)}')\n\n    _log(f'\u521D\u59CB\u5316 tokenizer (device={args.device})\
    \ ...')\n    tok = M.build_tokenizer(os.path.join(args.root, 'weights', 'SimulS2ST-Omni'),\n\
    \                            args.device)\n\n    writers: dict[str, M.ShardWriter]\
    \ = {}\n\n    def get_writer(lang: str) -> M.ShardWriter:\n        if lang not\
    \ in writers:\n            base = (args.shard_offset_base if args.shard_offset_base\
    \ >= 0\n                    else args.worker_id * 100000)\n            writers[lang]\
    \ = M.ShardWriter(out, lang, 5000, shard_offset=base)\n        return writers[lang]\n\
    \n    def fetch(it) -> str:\n        local = os.path.join(cache, os.path.basename(it['key']))\n\
    \        if os.path.exists(local) and os.path.getsize(local) == it['size']:\n\
    \            return local\n        _log(f'\u4E0B\u8F7D {it[\"key\"]} ({it[\"size\"\
    ] / 1e9:.2f}GB)')\n        s3.download_file(BUCKET, it['key'], local, Config=XFER)\n\
    \        return local\n\n    pool = ThreadPoolExecutor(max_workers=1)\n    stats\
    \ = {'in': 0, 'ok': 0, 'skip': 0, 'items': 0}\n    t0 = time.time()\n    nxt =\
    \ pool.submit(fetch, todo[0]) if todo else None\n    for i, it in enumerate(todo):\n\
    \        fut = nxt\n        nxt = pool.submit(fetch, todo[i + 1]) if i + 1 < len(todo)\
    \ else None\n        try:\n            local = fut.result()\n        except Exception\
    \ as e:  # noqa: BLE001\n            _log(f'[skip] \u4E0B\u8F7D\u5931\u8D25 {it[\"\
    key\"]}: {e}')\n            continue\n        if args.shared_gpu and not wait_gpu_free():\n\
    \            continue  # \u663E\u5B58\u88AB\u5BBF\u4E3B\u4EFB\u52A1\u5360\u6EE1\
    \uFF0C\u672C\u8F6E\u4E0D\u5904\u7406\uFF08\u4E0B\u4E00\u8F6E\u91CD\u542F\u540E\
    \u4F1A\u91CD\u8BD5\uFF09\n        try:\n            if it['reader'] == 'tar_pair':\n\
    \                itr = M.iter_tar_pair_yield([local])\n            elif it['reader']\
    \ == 'yodas_seg':\n                itr = M.iter_yodas_segments([local])\n    \
    \        else:\n                itr = M.iter_parquet([local])\n            predecoded\
    \ = it['reader'] in PREDECODED\n            w = get_writer(it['lang'])\n     \
    \       for uid, text, audio, dnsmos in itr:\n                stats['in'] += 1\n\
    \                wav = audio if predecoded else M.decode_audio(audio)\n      \
    \          if wav is None:\n                    stats['skip'] += 1\n         \
    \           continue\n                dur = wav.size / M.SR\n                if\
    \ dur < M.MIN_DURATION or dur > M.MAX_DURATION:\n                    stats['skip']\
    \ += 1\n                    continue\n                codes = M.torch_uint16_safe(tok(wav).squeeze(0))\n\
    \                n = int(codes.size)\n                if n < M.MIN_CODES or n\
    \ > M.MAX_CODES:\n                    stats['skip'] += 1\n                   \
    \ continue\n                w.add(uid, text, codes, dur, dnsmos)\n           \
    \     stats['ok'] += 1\n                if stats['ok'] % 500 == 0:\n         \
    \           _log(f'ok={stats[\"ok\"]} in={stats[\"in\"]} skip={stats[\"skip\"\
    ]} '\n                         f'items={stats[\"items\"]} elapsed={time.time()\
    \ - t0:.0f}s')\n        finally:\n            for w in writers.values():\n   \
    \             w.flush()\n            with open(done_path(it), 'w') as f:\n   \
    \             f.write(it['key'])\n            try:\n                os.remove(local)\n\
    \            except OSError:\n                pass\n        stats['items'] +=\
    \ 1\n    for w in writers.values():\n        w.flush()\n    _log(f'WORKER {args.worker_id}\
    \ DONE {json.dumps(stats)} '\n         f'elapsed={(time.time() - t0) / 60:.1f}min')\n\
    \n\nif __name__ == '__main__':\n    main()\n"
  uploader.py: "#!/usr/bin/env python3\n\"\"\"\u589E\u91CF\u4E0A\u4F20 TTS_omni \u4EA7\
    \u7269\u5230\u96C5\u52A0\u8FBE\u6876\u3002\n\n\u6587\u4EF6\u7EA7\u5E42\u7B49\uFF1A\
    marker \u6BCF\u884C \"mtime \u76F8\u5BF9\u8DEF\u5F84\"\u3002\u672C\u5730\u6587\
    \u4EF6 mtime \u53D8\u5316\uFF08worker \u91CD\u542F\u540E\nshard \u88AB\u91CD\u5199\
