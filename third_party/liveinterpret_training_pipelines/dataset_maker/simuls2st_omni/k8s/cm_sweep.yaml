  make_tts_dualcodec.py: "#!/usr/bin/env python3\n\"\"\"\u628A TTS/ \u5404\u6E90\u8F6C\
    \u6210 simuls2st_omni stage1 \u7684 DualCodec codes + manifest\u3002\n\n\u76EE\
    \u6807\u5E03\u5C40\uFF08stage1 TTSCodesDataset \u6D88\u8D39\uFF09:\n\n    <out>/manifest/<LANG>/shard-XXX.jsonl\n\
    \        {\"id\",\"text\",\"language\"<\u5C0F\u5199>,\"codes\":\"<LANG>/shard-XXX.npy:<start>:<end>\"\
    ,\n         \"dnsmos\"<\u53EF\u9009>,\"duration\"}\n    <out>/codes/<LANG>/shard-XXX.npy\
    \   # uint16, \u503C\u57DF[0,16384), 12.5Hz\n\n\u6E90\u7C7B\u578B\uFF08--source\uFF09\
    :\n  tar_pair   Emilia / Emilia-YODAS / yodas: tar \u5185 <id>.json + <id>.{mp3,webm}\n\
    \             \uFF08json \u9700\u542B text \u5B57\u6BB5\uFF1B\u4E0D\u542B text\
    \ \u7684\u8BB0\u5F55\u8BA1\u5165 skip_text\uFF09\n  parquet    ko patterned_utterance:\
    \ \u5217 id / audio / sentence\n  nemo       hifitts: NeMo manifest jsonl + \u97F3\
    \u9891\u6839\uFF08audio_filepath \u76F8\u5BF9\u6839\uFF09\n  iscslp     movie\
    \ json\uFF08target_segment.text\uFF09+ segments tar\uFF08<segment_id>.<ext>\uFF09\
    \n\n\u7528\u6CD5\uFF08\u96C6\u7FA4\u4E0A\u6BCF GPU \u4E00\u8FDB\u7A0B\uFF0C\u6309\
    \ --inputs \u5206\u7247\uFF09:\n\n  python make_tts_dualcodec.py --source tar_pair\
    \ \\\n      --inputs /data/ZH-B000000.tar /data/ZH-B000001.tar \\\n      --lang\
    \ ZH --out /out/TTS_omni \\\n      --weights /hf/SimulS2ST-Omni --device cuda:0\n\
    \n\u4F9D\u8D56: ffmpeg\uFF08\u89E3\u7801 mp3/webm\uFF09\u3001simuls2st_omni \u5305\
    \uFF08PYTHONPATH \u6307\u5411 custom/ \u7684\u7236\u76EE\u5F55\uFF09\u3001\n \
    \     HF \u6743\u91CD\u76EE\u5F55\uFF08dualcodec/ + w2v/\uFF0C\u6765\u81EA HA-SA-ki/SimulS2ST-Omni\uFF09\
    \u3002\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport\
    \ glob\nimport io\nimport json\nimport os\nimport subprocess\nimport sys\nimport\
    \ tarfile\nimport time\nfrom typing import Iterator, Optional\n\nimport numpy\
    \ as np\n\n# stage1 \u7684\u8FC7\u6EE4\u53E3\u5F84\uFF08smoke fixture STAGE1:\
    \ min_codes 8, max_codes 375 = 30s\uFF09\nMIN_CODES = 8\nMAX_CODES = 375\nMIN_DURATION\
    \ = 0.5\nMAX_DURATION = 30.0\nSR = 16000\nAUDIO_EXTS = ('.mp3', '.webm', '.flac',\
    \ '.wav', '.m4a', '.ogg', '.opus', '.aac')\nN_CODES = 16384\n\n\ndef _log(msg:\
    \ str) -> None:\n    print(f'[{time.strftime(\"%H:%M:%S\")}] {msg}', file=sys.stderr,\
    \ flush=True)\n\n\n# ---------------------------------------------------------------------------\n\
    # \u89E3\u7801: \u4EFB\u610F\u683C\u5F0F bytes -> 16kHz mono float32\n# ---------------------------------------------------------------------------\n\
    def decode_audio(data: bytes, timeout: int = 60) -> Optional[np.ndarray]:\n  \
    \  try:\n        p = subprocess.run(\n            ['ffmpeg', '-v', 'error', '-i',\
    \ 'pipe:0',\n             '-f', 'f32le', '-ac', '1', '-ar', str(SR), 'pipe:1'],\n\
    \            input=data, capture_output=True, timeout=timeout)\n    except subprocess.TimeoutExpired:\n\
    \        return None\n    if p.returncode != 0 or not p.stdout:\n        return\
    \ None\n    wav = np.frombuffer(p.stdout, dtype=np.float32)\n    if wav.size <\
    \ SR // 2:\n        return None\n    return np.ascontiguousarray(wav)\n\n\n# ---------------------------------------------------------------------------\n\
    # Tokenizer: \u590D\u7528 simuls2st_omni.voicebox.tokenizer.VoiceBoxAudioTokenizer\n\
    # ---------------------------------------------------------------------------\n\
    def build_tokenizer(weights_root: str, device: str):\n    from types import SimpleNamespace\
    \ as NS\n    dc = NS(n_codebooks=7, codebook_size=4096, semantic_codebook_size=N_CODES,\n\
    \            is_causal=True, semantic_downsample_factor=4,\n            pretrained_path=os.path.join(weights_root,\
    \ 'dualcodec', 'dualcodec.safetensors'))\n    km = NS(stat_mean_var_path=os.path.join(weights_root,\
    \ 'dualcodec', 'w2v_bert_stats.pt'))\n    cfg = NS(model=NS(dual_codec=dc, kmeans=km))\n\
    \    os.environ.setdefault('SIMULS2ST_W2V_BERT_PATH', os.path.join(weights_root,\
    \ 'w2v'))\n    from simuls2st_omni.voicebox.tokenizer import VoiceBoxAudioTokenizer\n\
    \    return VoiceBoxAudioTokenizer(cfg, device)\n\n\n# ---------------------------------------------------------------------------\n\
    # ShardWriter\n# ---------------------------------------------------------------------------\n\
    class ShardWriter:\n    def __init__(self, out_root: str, lang: str, shard_records:\
    \ int = 5000,\n                 shard_offset: int = 0):\n        self.manifest_dir\
    \ = os.path.join(out_root, 'manifest', lang)\n        self.codes_dir = os.path.join(out_root,\
    \ 'codes', lang)\n        os.makedirs(self.manifest_dir, exist_ok=True)\n    \
    \    os.makedirs(self.codes_dir, exist_ok=True)\n        self.lang = lang\n  \
    \      self.shard_records = shard_records\n        # \u591A worker \u5171\u5199\
    \u540C\u4E00 out \u65F6\u7528 offset \u9519\u5F00 shard \u7F16\u53F7\uFF0C\u907F\
    \u514D\u540C\u540D\u8986\u76D6\n        self.shard_idx = shard_offset\n      \
    \  self.rows: list[dict] = []\n        self.codes_parts: list[np.ndarray] = []\n\
    \        self.offset = 0\n        self.total_codes = 0\n\n    def add(self, uid:\
    \ str, text: str, codes: np.ndarray, duration: float,\n            dnsmos: Optional[float]\
    \ = None) -> None:\n        n = int(codes.size)\n        rec = {'id': uid, 'text':\
    \ text, 'language': self.lang.lower(),\n               'codes': f'{self.lang}/shard-{self.shard_idx:04d}.npy:{self.offset}:{self.offset\
    \ + n}',\n               'duration': round(duration, 3)}\n        if dnsmos is\
    \ not None:\n            rec['dnsmos'] = round(float(dnsmos), 3)\n        self.rows.append(rec)\n\
    \        self.codes_parts.append(codes)\n        self.offset += n\n        self.total_codes\
    \ += n\n        if len(self.rows) >= self.shard_records:\n            self.flush()\n\
    \n    def flush(self) -> None:\n        if not self.rows:\n            return\n\
    \        shard = f'shard-{self.shard_idx:04d}'\n        np.save(os.path.join(self.codes_dir,\
    \ shard + '.npy'),\n                np.concatenate(self.codes_parts).astype(np.uint16))\n\
    \        with open(os.path.join(self.manifest_dir, shard + '.jsonl'), 'w', encoding='utf-8')\
    \ as f:\n            for r in self.rows:\n                f.write(json.dumps(r,\
    \ ensure_ascii=False) + '\\n')\n        _log(f'shard {shard}: {len(self.rows)}\
    \ records, {self.offset} codes')\n        self.shard_idx += 1\n        self.rows\
    \ = []\n        self.codes_parts = []\n        self.offset = 0\n\n\n# ---------------------------------------------------------------------------\n\
    # Readers: \u7EDF\u4E00\u4EA7\u51FA (uid, text, audio_bytes, dnsmos|None)\n# ---------------------------------------------------------------------------\n\
    def iter_tar_pair_yield(tar_paths: list[str]) -> Iterator[tuple]:\n    \"\"\"\u751F\
    \u6210\u5668\u7248\uFF08\u7528\u8FD9\u4E2A\uFF09\uFF1A\u9010 tar \u6D41\u5F0F\uFF0C\
    json+audio \u6210\u5BF9\u540E yield\u3002\"\"\"\n    for tp in tar_paths:\n  \
    \      pending: dict[str, dict] = {}\n        tname = os.path.basename(tp)\n \
    \       try:\n            tf = tarfile.open(tp)\n        except tarfile.TarError\
    \ as e:\n            _log(f'[skip] \u6253\u4E0D\u5F00 {tname}: {e}')\n       \
    \     continue\n        with tf:\n            for m in tf:\n                if\
    \ not m.isfile():\n                    continue\n                stem, ext = os.path.splitext(m.name)\n\
    \                if ext == '.json':\n                    try:\n              \
    \          j = json.load(tf.extractfile(m))\n                    except Exception:\n\
    \                        continue\n                    e2 = pending.setdefault(stem,\
    \ {})\n                    e2['json'] = j\n                    e2.setdefault('uid',\
    \ stem)\n                elif ext.lower() in AUDIO_EXTS:\n                   \
    \ e2 = pending.setdefault(stem, {})\n                    e2['audio'] = tf.extractfile(m).read()\n\
    \                    e2.setdefault('uid', stem)\n                ready = [k for\
    \ k, v in pending.items() if 'audio' in v and 'json' in v]\n                for\
    \ k in ready:\n                    v = pending.pop(k)\n                    j =\
    \ v['json']\n                    raw = j.get('text') or j.get('transcript_text')\
    \ or ''\n                    if not raw:\n                        # yodas3: transcript\
    \ \u662F\u5206\u6BB5\u7684 JSON list\uFF0C\u6BCF\u6BB5 {\"start\",\"duration\"\
    ,\"text\",...}\n                        tr = j.get('transcript')\n           \
    \             if isinstance(tr, list):\n                            raw = ' '.join(str(seg.get('text')\
    \ or '').strip()\n                                           for seg in tr if\
    \ isinstance(seg, dict))\n                        elif isinstance(tr, str):\n\
    \                            raw = tr\n                    text = normalize_text(raw)\n\
    \                    if text and v.get('audio'):\n                        yield\
    \ (v['uid'], text, v['audio'], j.get('dnsmos'))\n                if len(pending)\
    \ > 512:\n                    # \u9632\u5FA1\uFF1A\u6781\u7AEF\u65E0\u914D\u5BF9\
    \u65F6\u4E22\u6700\u65E7\u7684 json-only \u9879\n                    for k in\
    \ [k for k, v in pending.items() if 'audio' not in v][:256]:\n               \
    \         pending.pop(k)\n        _log(f'[tar done] {tname}, pending unresolved={len(pending)}')\n\
    \n\ndef iter_yodas_segments(tar_paths: list[str]) -> Iterator[tuple]:\n    \"\"\
    \"yodas3\uFF1Atar \u5185 json + webm \u6210\u5BF9\uFF0Cjson.transcript \u662F\u5E26\
    \u65F6\u6233\u5206\u6BB5\uFF08ms\uFF09\u3002\n\n    \u6587\u4EF6\u6574\u957F\u4E2D\
    \u4F4D ~4 \u5206\u949F\uFF08\u4E0D\u80FD\u6574\u6761\u8FDB 30s \u8FC7\u6EE4\uFF09\
    \uFF0C\u987B\u6574\u6587\u4EF6\u89E3\u7801\u4E00\u6B21 16k PCM\uFF0C\n    \u518D\
    \u6309 (start, duration) \u5207\u6BB5\uFF1B\u6BB5\u95F4\u6709\u91CD\u53E0\uFF0C\
    \u8D2A\u5FC3\u4FDD\u7559\u4E0D\u91CD\u53E0\u6BB5\u3002\n    \u4EA7\u51FA (uid,\
    \ text, wav \u7247\u6BB5 np.ndarray, None)\u2014\u2014\u6CE8\u610F\u76F4\u63A5\
    \u7ED9 wav \u800C\u975E\u5B57\u8282\u3002\n    \"\"\"\n    for tp in tar_paths:\n\
    \        pending: dict[str, dict] = {}\n        tname = os.path.basename(tp)\n\
    \        try:\n            tf = tarfile.open(tp)\n        except tarfile.TarError\
    \ as e:\n            _log(f'[skip] \u6253\u4E0D\u5F00 {tname}: {e}')\n       \
    \     continue\n        with tf:\n            for m in tf:\n                if\
    \ not m.isfile():\n                    continue\n                stem, ext = os.path.splitext(m.name)\n\
    \                if ext == '.json':\n                    try:\n              \
    \          j = json.load(tf.extractfile(m))\n                    except Exception:\n\
    \                        continue\n                    e2 = pending.setdefault(stem,\
    \ {})\n                    e2['json'] = j\n                    e2.setdefault('uid',\
    \ stem)\n                elif ext.lower() in AUDIO_EXTS:\n                   \
    \ e2 = pending.setdefault(stem, {})\n                    e2['audio'] = tf.extractfile(m).read()\n\
    \                    e2.setdefault('uid', stem)\n                ready = [k for\
    \ k, v in pending.items() if 'audio' in v and 'json' in v]\n                for\
    \ k in ready:\n                    v = pending.pop(k)\n                    j =\
    \ v['json']\n                    segs = j.get('transcript')\n                \
    \    if not isinstance(segs, list) or not v.get('audio'):\n                  \
    \      continue\n                    # \u957F\u6587\u4EF6\uFF08\u53EF\u8FBE\u6570\
    \u5C0F\u65F6\uFF09\u653E\u5BBD\u89E3\u7801\u8D85\u65F6\n                    wav\
    \ = decode_audio(v['audio'], timeout=600)\n                    if wav is None:\n\
    \                        continue\n                    last_end = 0.0\n      \
    \              for si, seg in enumerate(segs):\n                        if not\
    \ isinstance(seg, dict):\n                            continue\n             \
    \           st = float(seg.get('start') or 0)\n                        du = float(seg.get('duration')\
    \ or 0)\n                        text = str(seg.get('text') or '').strip()\n \
    \                       if not text or du <= 0:\n                            continue\n\
    \                        if st < last_end:  # \u4E0E\u4E0A\u4E00\u4FDD\u7559\u6BB5\
    \u91CD\u53E0 \u2192 \u8DF3\u8FC7\n                            continue\n     \
    \                   s0 = int(st / 1000.0 * SR)\n                        s1 = min(int((st\
    \ + du) / 1000.0 * SR), wav.size)\n                        if s1 - s0 < int(MIN_DURATION\
    \ * SR):\n                            continue\n                        last_end\
    \ = st + du\n                        yield (f'{v[\"uid\"]}_s{si:03d}', text,\n\
    \                               np.ascontiguousarray(wav[s0:s1]), None)\n    \
    \    _log(f'[tar done] {tname}, pending unresolved={len(pending)}')\n\n\ndef iter_parquet(paths:\
    \ list[str]) -> Iterator[tuple]:\n    import pyarrow.parquet as pq\n    for p\
    \ in paths:\n        try:\n            t = pq.read_table(p, columns=['id', 'audio',\
    \ 'sentence'])\n        except Exception as e:\n            _log(f'[skip] parquet\
    \ {os.path.basename(p)}: {e}')\n            continue\n        ids = t['id'].to_pylist()\n\
    \        sents = t['sentence'].to_pylist()\n        audios = t['audio'].to_pylist()\n\
    \        for uid, sent, audio in zip(ids, sents, audios):\n            text =\
    \ (sent or '').strip()\n            data = None\n            if isinstance(audio,\
    \ dict):\n                data = audio.get('bytes')\n            elif isinstance(audio,\
    \ (bytes, bytearray)):\n                data = bytes(audio)\n            if text\
    \ and data:\n                yield (str(uid), text, data, None)\n        _log(f'[parquet\
    \ done] {os.path.basename(p)} rows={t.num_rows}')\n\n\ndef iter_nemo(manifest_path:\
    \ str, audio_root: str) -> Iterator[tuple]:\n    \"\"\"hifitts: \u6BCF\u884C jsonl,\
    \ audio_filepath \u76F8\u5BF9 audio_root\u3002\"\"\"\n    miss = hit = 0\n   \
    \ with open(manifest_path, encoding='utf-8') as f:\n        for line in f:\n \
    \           try:\n                r = json.loads(line)\n            except json.JSONDecodeError:\n\
    \                continue\n            text = (r.get('normalized_text') or r.get('text')\
    \ or '').strip()\n            p = os.path.join(audio_root, r.get('audio_filepath')\
    \ or '')\n            if not text or not os.path.isfile(p):\n                miss\
    \ += 1\n                continue\n            with open(p, 'rb') as af:\n    \
    \            data = af.read()\n            hit += 1\n            yield (os.path.basename(p),\
    \ text, data, None)\n    _log(f'[nemo done] hit={hit} miss={miss} (flac \u7F3A\
    \u5931\u4F1A\u5168\u90E8 miss)')\n\n\ndef iter_iscslp(json_path: str, tar_dirs:\
    \ list[str]) -> Iterator[tuple]:\n    \"\"\"movie json: [{movie_id,...,target_segment:{segment_id,text,...}}]\
    \ + tar \u5185\u97F3\u9891\u3002\n    \u97F3\u9891\u6587\u4EF6\u6309 segment_id\
    \ \u5728 tar_dirs \u7684 tar \u91CC\u627E\uFF08\u9996\u4E2A\u547D\u4E2D\u5373\u7528\
    \uFF09\u3002\"\"\"\n    index: dict[str, tuple[str, str]] = {}  # segment_id ->\
    \ (tar_path, member_name)\n    for d in tar_dirs:\n        for tp in sorted(glob.glob(os.path.join(d,\
    \ '*.tar'))):\n            try:\n                with tarfile.open(tp) as tf:\n\
    \                    for m in tf:\n                        if m.isfile() and os.path.splitext(m.name)[1].lower()\
    \ in AUDIO_EXTS:\n                            stem = os.path.basename(os.path.splitext(m.name)[0])\n\
    \                            index.setdefault(stem, (tp, m.name))\n          \
    \  except tarfile.TarError as e:\n                _log(f'[skip] tar {tp}: {e}')\n\
    \    _log(f'[iscslp] \u7D22\u5F15\u4E86 {len(index)} \u4E2A\u97F3\u9891\u6BB5\
    ')\n    with open(json_path, encoding='utf-8') as f:\n        rows = json.load(f)\n\
    \    hit = 0\n    for r in rows:\n        seg = r.get('target_segment') or {}\n\
    \        sid = str(seg.get('segment_id') or '')\n        text = (seg.get('text')\
    \ or '').strip()\n        if not sid or not text or sid not in index:\n      \
    \      continue\n        tp, member = index[sid]\n        with tarfile.open(tp)\
    \ as tf:\n            data = tf.extractfile(member).read()\n        hit += 1\n\
    \        yield (sid, text, data, None)\n    _log(f'[iscslp done] hit={hit}/{len(rows)}')\n\
    \n\n# ---------------------------------------------------------------------------\n\
    # \u4E3B\u6D41\u7A0B\n# ---------------------------------------------------------------------------\n\
    def main() -> None:\n    ap = argparse.ArgumentParser(description=__doc__)\n \
    \   ap.add_argument('--source', required=True,\n                    choices=['tar_pair',\
    \ 'parquet', 'nemo', 'iscslp'])\n    ap.add_argument('--inputs', nargs='*', default=[],\
    \ help='tar/parquet \u6587\u4EF6\u5217\u8868\uFF08\u53EF glob\uFF09')\n    ap.add_argument('--manifest',\
    \ default=None, help='nemo/iscslp \u7684 manifest/json \u8DEF\u5F84')\n    ap.add_argument('--audio-root',\
    \ default=None, help='nemo \u7684\u97F3\u9891\u6839')\n    ap.add_argument('--tar-dirs',\
    \ nargs='*', default=[], help='iscslp \u7684\u97F3\u9891 tar \u76EE\u5F55')\n\
    \    ap.add_argument('--lang', required=True, help='\u5927\u5199\u8BED\u8A00\u7801\
    \uFF1AEN/ZH/JA/KO')\n    ap.add_argument('--out', required=True, help='TTS_omni\
    \ \u8F93\u51FA\u6839')\n    ap.add_argument('--weights', required=True, help='HF\
    \ \u6743\u91CD\u6839\uFF08\u542B dualcodec/ w2v/\uFF09')\n    ap.add_argument('--device',\
    \ default='cuda:0')\n    ap.add_argument('--shard-records', type=int, default=5000)\n\
    \    ap.add_argument('--shard-offset', type=int, default=0,\n                \
    \    help='\u591A worker \u5171\u5199\u540C\u4E00 out \u65F6\u7684 shard \u7F16\
    \u53F7\u8D77\u70B9\uFF08\u5982 worker_id*100000\uFF09')\n    ap.add_argument('--limit',\
    \ type=int, default=0, help='\u8BD5\u70B9\u9650\u91CF')\n    args = ap.parse_args()\n\
    \n    inputs = []\n    for pat in args.inputs:\n        inputs.extend(sorted(glob.glob(pat))\
    \ if any(c in pat for c in '*?[') else [pat])\n\n    if args.source == 'tar_pair':\n\
    \        it = iter_tar_pair_yield(inputs)\n    elif args.source == 'parquet':\n\
    \        it = iter_parquet(inputs)\n    elif args.source == 'nemo':\n        assert\
    \ args.manifest and args.audio_root, 'nemo \u9700\u8981 --manifest \u548C --audio-root'\n\
    \        it = iter_nemo(args.manifest, args.audio_root)\n    else:\n        assert\
    \ args.manifest and args.tar_dirs, 'iscslp \u9700\u8981 --manifest \u548C --tar-dirs'\n\
    \        it = iter_iscslp(args.manifest, args.tar_dirs)\n\n    _log(f'\u521D\u59CB\
    \u5316 tokenizer (device={args.device}) ...')\n    tok = build_tokenizer(args.weights,\
    \ args.device)\n    writer = ShardWriter(args.out, args.lang, args.shard_records,\
    \ args.shard_offset)\n\n    stats = {'in': 0, 'skip_decode': 0, 'skip_dur': 0,\
    \ 'skip_codes': 0, 'ok': 0}\n    t0 = time.time()\n    for uid, text, audio, dnsmos\
    \ in it:\n        stats['in'] += 1\n        if args.limit and stats['ok'] >= args.limit:\n\
    \            break\n        wav = decode_audio(audio)\n        if wav is None:\n\
    \            stats['skip_decode'] += 1\n            continue\n        dur = wav.size\
    \ / SR\n        if dur < MIN_DURATION or dur > MAX_DURATION:\n            stats['skip_dur']\
    \ += 1\n            continue\n        codes = torch_uint16_safe(tok(wav).squeeze(0))\n\
    \        n = int(codes.size)\n        if n < MIN_CODES or n > MAX_CODES:\n   \
    \         stats['skip_codes'] += 1\n            continue\n        writer.add(uid\
    \ or f'u{stats[\"in\"]}', text, codes, dur, dnsmos)\n        stats['ok'] += 1\n\
    \        if stats['ok'] % 500 == 0:\n            rtf = (time.time() - t0) / max(stats['ok']\
    \ * 0.0, 1)\n            _log(f'ok={stats[\"ok\"]} in={stats[\"in\"]} skip={stats[\"\
    skip_decode\"]+stats[\"skip_dur\"]+stats[\"skip_codes\"]} '\n                \
    \ f'({stats[\"ok\"]/max(stats[\"in\"],1)*100:.1f}%) elapsed={time.time()-t0:.0f}s')\n\
    \    writer.flush()\n    stats['shards'] = writer.shard_idx\n    stats['total_codes']\
    \ = writer.total_codes\n    stats['elapsed_sec'] = round(time.time() - t0, 1)\n\
    \    summary = os.path.join(args.out, f'_summary_{args.lang}_{os.getpid()}.json')\n\
    \    with open(summary, 'w', encoding='utf-8') as f:\n        json.dump(stats,\
    \ f, ensure_ascii=False, indent=1)\n    _log(f'DONE {json.dumps(stats)}')\n\n\n\
    def torch_uint16_safe(x):\n    \"\"\"tensor -> np.uint16\uFF08\u503C\u57DF\u6821\
    \u9A8C\uFF09\u3002\"\"\"\n    if hasattr(x, 'detach'):\n        x = x.detach().cpu().numpy()\n\
    \    x = np.asarray(x).reshape(-1).astype(np.int64)\n    assert x.min() >= 0 and\
    \ x.max() < N_CODES, f'codes \u8D85\u51FA\u8BCD\u8868: [{x.min()},{x.max()}]'\n\
    \    return x.astype(np.uint16)\n\n\ndef normalize_text(text: str) -> str:\n \
    \   \"\"\"yodas3 \u7684 text \u5B57\u6BB5\u662F\u5B57\u7B26\u4E32\u5316\u7684\
    \ list\uFF1A[{'text': '...', ...}, ...]\u3002\"\"\"\n    t = (text or '').strip()\n\
    \    if t.startswith('[') and t.endswith(']'):\n        try:\n            import\
    \ ast\n            v = ast.literal_eval(t)\n            if isinstance(v, list)\
    \ and v:\n                parts = []\n                for e in v:\n          \
    \          if isinstance(e, dict) and e.get('text'):\n                       \
    \ parts.append(str(e['text']).strip())\n                    elif isinstance(e,\
    \ str):\n                        parts.append(e.strip())\n                return\
    \ ' '.join(p for p in parts if p)\n        except (ValueError, SyntaxError):\n\
    \            pass\n    return t\n\n\nif __name__ == '__main__':\n    main()\n"
  startup.sh: "#!/usr/bin/env bash\n# TTS_omni \u6570\u636E\u51C6\u5907\u5165\u53E3\
    \uFF08\u7F8E\u897F i-04ed1446\uFF0C6 \u5361 / 18 worker\uFF0C3 worker/GPU\uFF09\
    \nset -euo pipefail\n\nROOT=/opt/dlami/nvme/stevehguo/tts_omni\nRAW=/opt/raw\n\
    NW=${NW:-18}                    # \u672C Pod \u8FD0\u884C\u7684 worker \u6570\n\
    NWT=${NWT:-40}                  # \u5168\u5C40\u5206\u533A\u6A21\u6570\uFF1A\u591A\
    \u4E2A Pod \u5171\u7528\u540C\u4E00\u6279 items \u65F6\u5FC5\u987B\u4E00\u81F4\
    \nWORKER_START=${WORKER_START:-0} # \u672C Pod \u7684\u8D77\u59CB worker id\uFF08\
    \u5168\u5C40\u552F\u4E00\uFF09\nNGPU=${NGPU:-6}\n\n# \u7EBF\u7A0B\u4E0A\u9650\uFF1A\
    torch/BLAS \u9ED8\u8BA4\u6BCF\u8FDB\u7A0B\u8D77 448 \u7EBF\u7A0B\u5BFC\u81F4\u4E25\
    \u91CD\u8D85\u8BA2\uFF08load 340+/448\uFF09\u3002\n# \u9650\u5230 8 \u540E\u5355\
    \ worker \u6548\u7387\u66F4\u9AD8\uFF0C\u4F59\u51FA CPU \u7ED9\u66F4\u591A worker\
    \ \u5E76\u884C\u3002\nexport OMP_NUM_THREADS=${OMP_NUM_THREADS:-8}\nexport MKL_NUM_THREADS=${MKL_NUM_THREADS:-8}\n\
    export OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-8}\nexport NUMEXPR_NUM_THREADS=${NUMEXPR_NUM_THREADS:-8}\n\
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True\n\nmkdir -p \"$ROOT\"\
    /{code,cache,done,logs} \"$ROOT\"/weights\n\n# ---- \u4EE3\u7801\uFF08configMap\
    \ \u53EA\u80FD\u5E73\u94FA\uFF0C\u5305\u7528 tar \u4F20\u9012\uFF09----\ncp \"\
    $RAW\"/make_tts_dualcodec.py \"$RAW\"/tts_omni_driver.py \"$RAW\"/uploader.py\
    \ \"$ROOT\"/code/\nif [ ! -d \"$ROOT\"/code/custom/simuls2st_omni ]; then\n  tar\
    \ xzf \"$RAW\"/pkg.tar.gz -C \"$ROOT\"/code/\nfi\nexport PYTHONPATH=\"$ROOT/code/custom:$ROOT/code${PYTHONPATH:+:$PYTHONPATH}\"\
    \nexport HF_HOME=\"$ROOT/hf\"\nexport PYTHONUNBUFFERED=1\n\n# ---- \u4F9D\u8D56\
    \uFF08voicebox tokenizer \u94FE\uFF1Aaudiotools/dac/easydict/hyperpyyaml/ruamel.yaml/json5\uFF09\
    ----\npython3 -m pip install -q boto3 huggingface_hub descript-audiotools descript-audio-codec\
    \ \\\n  easydict hyperpyyaml ruamel.yaml json5 einops six 2>&1 | tail -1 || true\n\
    \n# ---- DualCodec + w2v \u6743\u91CD\uFF08\u5E42\u7B49\uFF0C\u7EA6 5GB\uFF0C\u6765\
    \u81EA HF \u516C\u5F00\u4ED3\u5E93\uFF09----\nif [ ! -f \"$ROOT\"/weights/SimulS2ST-Omni/dualcodec/dualcodec.safetensors\
    \ ]; then\n  echo \"[startup] \u4E0B\u8F7D tokenizer \u6743\u91CD ...\"\n  python3\
    \ - <<'PY'\nfrom huggingface_hub import snapshot_download\nsnapshot_download('HA-SA-ki/SimulS2ST-Omni',\n\
    \                  allow_patterns=['dualcodec/*', 'w2v/*'],\n                \
    \  local_dir='/opt/dlami/nvme/stevehguo/tts_omni/weights/SimulS2ST-Omni')\nprint('[startup]\
    \ \u6743\u91CD\u5C31\u7EEA')\nPY\nfi\n\n# ---- \u540E\u53F0\u589E\u91CF\u4E0A\u4F20\
    \ ----\nnohup python3 \"$ROOT\"/code/uploader.py --root \"$ROOT\" > \"$ROOT\"\
    /logs/uploader.log 2>&1 &\n\n# ---- workers\uFF1A\u6BCF GPU \u4E2A\u6570 = NW/NGPU\uFF0C\
    \u5168\u5C40 id \u4ECE WORKER_START \u8D77 ----\necho \"[startup] \u542F\u52A8\
    \ $NW \u4E2A worker\uFF08\u5168\u5C40 id $WORKER_START..$((WORKER_START + NW -\
    \ 1))\uFF0C\u6A21\u6570 $NWT\uFF09...\"\npids=()\n# \u8865\u8DD1\u53C2\u6570\uFF08\
    \u53EF\u9009\uFF09\uFF1ARESIDUE_MOD/MIN/MAX \u5708\u5B9A\u6F0F\u6389\u7684\u5206\
    \u533A\uFF0CSHARD_OFFSET_BASE \u907F\u5F00\u65E2\u6709 shard\nRES=\"\"\nif [ -n\
    \ \"${ONLY_KEYS:-}\" ]; then\n  RES=\"--only-keys $ONLY_KEYS\"\nelif [ -n \"${RESIDUE_MOD:-}\"\
    \ ]; then\n  RES=\"--residue-mod $RESIDUE_MOD --residue-min ${RESIDUE_MIN:-0}\
    \ --residue-max ${RESIDUE_MAX:-$((RESIDUE_MOD - 1))}\"\nfi\nfor w in $(seq $WORKER_START\
    \ $((WORKER_START + NW - 1))); do\n  SOB=\"\"\n  if [ -n \"${SHARD_OFFSET_BASE:-}\"\
    \ ]; then\n    SOB=\"--shard-offset-base $((SHARD_OFFSET_BASE + (w - WORKER_START)\
    \ * 100000))\"\n  fi\n  CUDA_VISIBLE_DEVICES=$((w % NGPU)) python3 \"$ROOT\"/code/tts_omni_driver.py\
    \ \\\n    --worker-id \"$w\" --nworkers \"$NWT\" --root \"$ROOT\" --device cuda:0\
    \ \\\n    ${SHARED_GPU:+--shared-gpu} $RES $SOB \\\n    > \"$ROOT\"/logs/worker-$w.log\
    \ 2>&1 &\n  pids+=($!)\ndone\n\nfail=0\nfor p in \"${pids[@]}\"; do\n  wait \"\
    $p\" || fail=1\ndone\n\n# ---- \u6700\u7EC8\u5168\u91CF\u4E0A\u4F20 ----\npython3\
    \ \"$ROOT\"/code/uploader.py --root \"$ROOT\" --once >> \"$ROOT\"/logs/uploader.log\
    \ 2>&1 || true\necho \"[startup] ALL DONE fail=$fail\uFF08$(date -u)\uFF09\"\n\
    exit $fail\n"
