apiVersion: v1
kind: Pod
metadata:
  labels:
    app: tts-omni-recover
    owner: stevehguo
  name: tts-omni-audit
  namespace: ktrain-users
spec:
  containers:
  - command:
    - bash
    - -c
    - python3 -m pip install -q boto3 2>&1 | tail -1; python3 /opt/rec/audit_union.py
    env:
    - name: AWS_DEFAULT_REGION
      value: ap-southeast-3
    - name: PYTHONUNBUFFERED
      value: '1'
    envFrom:
    - secretRef:
        name: aws-jkt-creds
    image: 124355679795.dkr.ecr.ap-southeast-3.amazonaws.com/ktrain/speech-language-model:p5-cuda12.8-torch2.8-te-v9-streaming-si-v1
    name: r
    resources:
      limits:
        cpu: '32'
        memory: 200Gi
      requests:
        cpu: '8'
        memory: 96Gi
    volumeMounts:
    - mountPath: /opt/rec
      name: rec
      readOnly: true
    - mountPath: /opt/dlami/nvme
      name: nvme
      readOnly: true
  nodeSelector:
    kubernetes.io/hostname: hyperpod-i-04ed14465ab855810
  restartPolicy: Never
  volumes:
  - configMap:
      name: tts-omni-audit
    name: rec
  - hostPath:
      path: /opt/dlami/nvme
      type: Directory
    name: nvme
