# =============================================================================
# stage1 数据质量评估：等造数 Job 全部跑完 -> 扫全量 parquet -> 出报告（回传 S3）
# =============================================================================
# 「跑完」的判定：TTS_FSQ 下 parquet 文件数连续 N 分钟不再变化（无需 k8s RBAC）。
# 报告落在 s3://stevehguo-ap-southeast-3/<PREFIX>/_QA/{report.md,report.json}
#
# 提交：
#   kubectl -n speech-h200 apply -f k8s_qa_job.yaml
# 取回本地：
#   aws s3 cp s3://stevehguo-ap-southeast-3/speech_model_backup/stevehguo/data_fortrain/\
#       data_fortrain_1031version/TTS_FSQ/_QA/report.md ./TTS_FSQ_QA_report.md --region ap-southeast-3
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: tts-stage1-fsq-qa
  namespace: speech-h200
  labels:
    app: tts-stage1-fsq
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: tts-stage1-fsq
    spec:
      restartPolicy: Never
      containers:
        - name: qa
          image: 124355679795.dkr.ecr.ap-southeast-3.amazonaws.com/ktrain/speech-language-model:p5-cuda12.8-torch2.8-te-v9-streaming-si-v1
          command: ["bash", "-c"]
          args:
            - |
              set -eu
              python3 -m pip install -q boto3
              cd /opt/tts_stage1_fsq
              # 1) 等造数 Job 全部跑完（parquet 文件数连续 N 分钟不变）
              # 2) UTMOS 抽样评分（回到源音频，parquet 里只有 token）
              # 3) 扫全量 parquet 出报告（会自动合并 utmos.json）
              python3 utmos_sample.py --per-source "${UTMOS_PER_SOURCE}" --units 2 --device "${UTMOS_DEVICE}" \
                  --out-s3-key "${QA_PREFIX}/utmos.json" || true
              exec python3 qa_stage1.py --wait-stable "${WAIT_STABLE_MIN}" --workers "${WORKERS}"
          envFrom:
            - secretRef:
                name: aws-local-creds
          env:
            - name: AWS_DEFAULT_REGION
              value: ap-southeast-3
            - name: WAIT_STABLE_MIN
              value: "2"       # 数据已定型，2 分钟即可
            - name: WORKERS
              value: "8"
            - name: UTMOS_PER_SOURCE
              value: "150"
            - name: UTMOS_DEVICE
              value: "cpu"
            - name: QA_PREFIX
              value: "speech_model_backup/stevehguo/data_fortrain/data_fortrain_1031version/TTS_FSQ/_QA"
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
            limits:
              cpu: "32"
              memory: 160Gi
          volumeMounts:
            - name: code
              mountPath: /opt/tts_stage1_fsq
      volumes:
        - name: code
          configMap:
            name: tts-stage1-fsq
