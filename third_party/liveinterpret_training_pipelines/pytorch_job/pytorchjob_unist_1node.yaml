# =============================================================================
# Kubeflow PyTorchJob — unist S2S 桥接对齐 Megatron SFT（**单节点** 8×H200）
#
# 与 pytorch_job/pytorchjob.yaml 的差异（本文件是它的派生变体，非替代）：
#   1. 数据集换成 unist（/fsx/zeyangsong/unist/converted），模型换成
#      qwen2_5_3b_omnispeak_a；
#   2. manifest 与原音频**全部在 FSX 上**，用 fsx:// scheme 直读，不做同步；
#   3. 单节点：只有 Master，无 Worker（白名单 1 个节点）。
#      双节点对照组见 pytorchjob_unist_2node.yaml —— 除节点数 / OUTPUT_DIR
#      外两份文件逐字一致，用于对比分布式提效。
#
# =============================================================================
# 为什么 unist 音频用 fsx:// 而不是 s3://（细分任务 3/4 的结论，已取证）
# =============================================================================
#   * unist manifest 里的音频引用形如
#       wds://unist/audio/processed/shards/dataset=unist/
#            process_version=unist_bicodec_qwen3_v2/rank0N/train-XXXXX-XXXXX.tar
#     即全部收敛到**单一前缀** dataset=unist / process_version=unist_bicodec_qwen3_v2
#     （_SUMMARY.json: process_version=unist_bicodec_qwen3_v2，tar_shards=662；
#      FSX 上实际 662 个 .tar，分布在 rank00..rank07 八个子目录，合计 2.2TB）。
#   * 但数据桶
#       s3://iegg-speech-model-data-124355679795-ap-southeast-3-an/data/audio/
#       processed/shards/
#     下共 55 个 dataset=* 前缀，**没有 dataset=unist**（已 aws s3 ls 核实）。
#     即 unist 音频在 S3 上没有任何副本，只存在于 FSX。
#   => ARTIFACT_AUDIO_SHARDS 无法填 S3 前缀；改为 fsx:// 声明来源 + 由下面的
#      volumeMount 直接把 FSX 目录挂到 wds:// 解析出的容器路径上。
#
# =============================================================================
# 音频路径如何对上 —— 靠挂载映射，不改任何训练代码
# =============================================================================
#   custom/wds_audio.py 把 wds://<netloc>/<path> 解析为容器内 /<netloc>/<path>
#   （1:1，代码里没有任何映射表）。wds:// URI 解析出的
#     /unist/audio/processed/shards/dataset=unist/process_version=unist_bicodec_qwen3_v2
#   由 initContainer 软链指到真实音频目录：
#     /unist -> emptyDir(unist-audio-link) -> symlink
#       audio/processed/shards/dataset=unist/process_version=unist_bicodec_qwen3_v2
#       -> /fsx/zeyangsong/unist/converted/unist_qwen3_s2s_v2/speech/unist_bicodec_qwen3_v2
#   （FSX 整卷只挂一次名为 `fsx` 的 volume -> /fsx；FSX_MOUNT env 必须与其
#    mountPath 逐字一致，derive_sync_jobs.py 据此解析 FSX_MOUNT。）
#
# =============================================================================
# 工件 URI scheme（与 launch_train.sh / derive_sync_jobs.py 严格一一对应）
# =============================================================================
#   s3://<bucket>/<key>  aws s3 sync 到各节点 NVMe，容器内 = /nvme/<key>
#   s3mnt://<key>        从 S3 CSI 挂载点本地同步到 NVMe，容器内 = /nvme/<key>
#   fsx://<path>         **完全不同步**，容器内 = ${FSX_MOUNT}/<path>
# =============================================================================
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: __JOB_NAME__
  namespace: speech-h200
spec:
  pytorchReplicaSpecs:
    # ----- Master (rank 0) —— 单节点场景下这是唯一的 replica -----
    # 单节点不声明 Worker：derive_sync_jobs.py 的 A3 校验要求
    #   Master.replicas + Worker.replicas == len(节点白名单)
    # 这里 1 + 0 == 1，白名单也必须恰好 1 个 hostname。
    Master:
      replicas: 1
      restartPolicy: Never  # 崩溃即终止，禁止重启/重试
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          serviceAccountName: speech-h200-sa
          nodeSelector:
            node.kubernetes.io/instance-type: ml.p5e.48xlarge
          # 单节点白名单（1 个 hostname，必须 == Master.replicas + Worker.replicas）。
          # 选 03e7d1f6：它是上一轮 z5ht 双节点训练的 Master 节点，已验证
          # EFA / NVMe / FSX 挂载均正常，且当前 GPU allocated = 0。
          # 双节点对照组会用 03e7d1f6 + 049e0c04，保证单节点是双节点的真子集，
          # 排除「换了台机器导致快慢」的混淆变量。
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [hyperpod-i-03e7d1f6d95864e1a]
          volumes:
            - name: s3all
              persistentVolumeClaim:
                claimName: speech-h200-s3-pvc
                readOnly: true
            # FSX 整卷：manifest 直读（BRIDGE_ALIGNMENT_DATA=fsx://...）。
            # volume 名必须是 `fsx`，derive_sync_jobs.py 按此名解析 FSX_MOUNT。
            - name: fsx
              persistentVolumeClaim:
                claimName: speech-h200-fsx-pvc
                readOnly: true
            # 音频路径对齐：不再二次挂载同一 FSX PVC（同 PVC 挂两次会让 kubelet
            # 卷挂载死锁，Pod 永远 ContainerCreating，FSX CSI 也收不到挂载调用）。
            # 改为只挂一次根卷 /fsx，由 initContainer 在共享 emptyDir 上建软链，
            # 把 wds:// 解析出的容器路径指到 /fsx 下真实音频目录。
            - name: unist-audio-link
              emptyDir: {}
            - name: nvme
              hostPath:
                path: /opt/dlami/nvme
                type: Directory
            - name: launcher
              configMap:
                name: launch-train-script-__RUN_ID__
                defaultMode: 0755
            - name: workspace
              emptyDir: {}
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 64Gi
          initContainers:
            - name: mk-unist-audio-link
              image: 124355679795.dkr.ecr.ap-southeast-3.amazonaws.com/ktrain/speech-language-model:p5-cuda12.8-torch2.8-te-v9
              command:
                - bash
                - -c
                - |
                  mkdir -p /unist-link/audio/processed/shards/dataset=unist
                  ln -sfn /fsx/zeyangsong/unist/converted/unist_qwen3_s2s_v2/speech/unist_bicodec_qwen3_v2 \
                         "/unist-link/audio/processed/shards/dataset=unist/process_version=unist_bicodec_qwen3_v2"
              volumeMounts:
                - name: fsx
                  mountPath: /fsx
                  readOnly: true
                - name: unist-audio-link
                  mountPath: /unist-link
          containers:
            - name: pytorch
              image: 124355679795.dkr.ecr.ap-southeast-3.amazonaws.com/ktrain/speech-language-model:p5-cuda12.8-torch2.8-te-v9
              imagePullPolicy: IfNotPresent
              command: ["bash", "-c", "/opt/launcher/launch_train.sh"]
              env:
                - name: TRAIN_SCRIPT
                  value: "pipelines/bridge_alignment/train_speech_to_speech_translation.sh"
                - name: TRAIN_BACKEND
                  value: "megatron"
                - name: CODE_PREFIX
                  value: "deferzhou/liveinterpret_training_pipelines"
                - name: NVME_MOUNT
                  value: "/nvme"
                # 必须与上面 volume `fsx` 的 mountPath 逐字一致，
                # launch_train.sh 用它把 fsx://<path> 拼成容器内真实路径。
                - name: FSX_MOUNT
                  value: "/fsx"
                # ----- 模型 / tokenizer：S3 直链，同步到各节点 NVMe -----
                - name: MODEL_PATH
                  value: "s3://iegg-speech-model-models/origin_models/custom_models/qwen2_5_3b_omnispeak_a"
                - name: MODEL_TYPE
                  value: "qwen2_5_3b_omnispeak_a"
                - name: QWEN3_TTS_TOKENIZER
                  value: "s3://iegg-speech-model-models/origin_models/Qwen3-TTS-Tokenizer-12Hz"
                # ----- manifest：FSX 直读，不同步 -----
                # 只取 manifest-train-*.jsonl（198 个）。该目录下另有 10 个
                # dev / test / clean_dev / clean_test / *_other 变体 manifest，
                # 用 *.jsonl 会把验证集混进训练集 —— 必须显式限定 train。
                # eval 集由 SPLIT_DATASET_RATIO(0.01) 从 train 切分。
                - name: BRIDGE_ALIGNMENT_DATA
                  value: "fsx://zeyangsong/unist/converted/unist_qwen3_s2s_v2/manifests/manifest-train-*.jsonl"
                # ----- 原音频 shards：FSX 直读，不同步 -----
                # 这里声明的是「数据来源」（供 derive 打印 fsx-direct 清单）；
                # 训练实际读取路径由 initContainer 软链 + /unist 挂载决定，
                # 两者指向同一份物理数据的两个容器视图。
                - name: ARTIFACT_AUDIO_SHARDS
                  value: "fsx://zeyangsong/unist/converted/unist_qwen3_s2s_v2/speech/unist_bicodec_qwen3_v2"
                - name: OUTPUT_ROOT
                  value: "/nvme/output"
                # 显式指定 output_dir：swift 用它作为 wandb 实验名，
                # 单 / 双节点必须能一眼区分，否则两条曲线混在一起没法比。
                - name: OUTPUT_DIR
                  value: "/nvme/output/unist_s2s_1node"

                - name: NCCL_IB_DISABLE
                  value: "0"
                - name: NCCL_SOCKET_IFNAME
                  value: ^lo,docker0
                - name: FI_PROVIDER
                  value: efa
                - name: NCCL_DEBUG
                  value: INFO
                - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
                  value: "1"
                - name: TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC
                  value: "300"
                - name: FI_EFA_FORK_SAFE
                  value: "1"
                - name: FI_EFA_USE_DEVICE_RDMA
                  value: "1"
                - name: NCCL_DEBUG_SUBSYS
                  value: INIT,NET,ENV
                - name: PYTORCH_CUDA_ALLOC_CONF
                  value: "expandable_segments:True"
                - name: WANDB_API_KEY
                  value: "local-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"
                - name: WANDB_BASE_URL
                  value: http://43.173.190.72:8080
                # 单 / 双节点用同一个 project，两条 run 才能直接叠图对比。
                # 注意：megatron-swift **不读** WANDB_PROJECT 环境变量，它只认
                # --wandb_project 命令行参数（默认 'megatron-swift'）。
                # common_args_megatron.sh 已把这个 env 显式转成命令行参数传下去。
                - name: WANDB_PROJECT
                  value: qwen_omnispeak_unist_scaling
                # run 名必须一眼区分单 / 双节点，否则两条曲线在同一 project 里
                # 只能靠随机名分辨。同理转成 --wandb_exp_name 传下去。
                - name: WANDB_EXP_NAME
                  value: unist-s2s-1node
                - name: WANDB_MODE
                  value: online
              resources:
                requests:
                  cpu: "135"
                  memory: 1350Gi
                  ephemeral-storage: "200Gi"
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "32"
                limits:
                  cpu: "150"
                  memory: 1500Gi
                  ephemeral-storage: "200Gi"
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "32"
              volumeMounts:
                - name: s3all
                  mountPath: /s3all
                  readOnly: true
                - name: fsx
                  mountPath: /fsx
                  readOnly: true
                # 共享 emptyDir 挂到 /unist；软链由 initContainer 建好，
                # 把 wds:// 解析出的容器路径指到 /fsx 下真实音频目录。
                - name: unist-audio-link
                  mountPath: /unist
                - name: nvme
                  mountPath: /nvme
                - name: launcher
                  mountPath: /opt/launcher
                - name: workspace
                  mountPath: /local
                - name: dshm
                  mountPath: /dev/shm
