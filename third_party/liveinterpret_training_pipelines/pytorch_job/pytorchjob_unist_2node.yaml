                - |
                  mkdir -p /unist-link/audio/processed/shards/dataset=unist
                  ln -sfn /fsx/zeyangsong/unist/converted/unist_qwen3_s2s_v2/speech/unist_bicodec_qwen3_v2                          "/unist-link/audio/processed/shards/dataset=unist/process_version=unist_bicodec_qwen3_v2"
              volumeMounts:
                - name: fsx
                  mountPath: /fsx
                  readOnly: true
                - name: unist-audio-link
                  mountPath: /unist-link
          containers:
            - name: pytorch
              image: 124355679795.dkr.ecr.ap-southeast-3.amazonaws.com/ktrain/speech-language-model:p5-cuda12.8-torch2.8-te-v9
              imagePullPolicy: IfNotPresent
